<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06100A">
<title>ZSGREEN</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2327E36F'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11' stroke='%2306100A' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06100A; --bg2:#0A1710; --card:#0F2016; --card2:#15291D; --line:#1F3B2B;
  --txt:#EAF7EF; --mut:#8CAA97; --g:#27E36F; --g2:#14B655; --red:#FF6161; --amb:#FFC247;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  background:
    radial-gradient(900px 420px at 50% -120px, rgba(39,227,111,.16), transparent 70%),
    linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px) 0 0/100% 44px,
    var(--bg);
  color:var(--txt); font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,sans-serif;
  padding-bottom:env(safe-area-inset-bottom,0px); line-height:1.4;
}
button,input{font-family:inherit}
.wrap{max-width:520px;margin:0 auto;padding:0 16px 120px}
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top,0px)) 0 10px}
.logo{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:19px;letter-spacing:.2px}
.logo b{color:var(--g)}
.logo svg{width:26px;height:26px}
.hello{font-size:12.5px;color:var(--mut);text-align:right;line-height:1.3}
.hello strong{color:var(--txt);font-size:14px;display:block}
.demo{margin:0 -16px 6px;padding:7px 16px;background:rgba(255,194,71,.12);color:var(--amb);font-size:12px;font-weight:600;text-align:center}

.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:999px;padding:9px 16px;font-weight:700;font-size:13.5px;cursor:pointer}
.tab.on{background:var(--g);color:#04210F;border-color:var(--g)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card h2,.card h3{margin:0 0 10px;font-size:16px}
.mut{color:var(--mut);font-size:13px}
.sm{font-size:12px}
.row{display:flex;gap:10px;align-items:center}
.row.sp{justify-content:space-between}
.grow{flex:1;min-width:0}

.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:800;font-size:15px;cursor:pointer;width:100%;transition:transform .08s,filter .15s}
.btn:active{transform:scale(.98)}
.btn.p{background:var(--g);color:#04210F;box-shadow:0 6px 22px rgba(39,227,111,.28)}
.btn.s{background:transparent;color:var(--g);border:1.5px solid var(--g)}
.btn.d{background:rgba(255,97,97,.12);color:var(--red);border:1.5px solid rgba(255,97,97,.5)}
.btn.g{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.btn.xs{width:auto;padding:8px 12px;font-size:12.5px;border-radius:10px}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1}

label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.5px}
label:first-child{margin-top:0}
input[type=text],input[type=email],input[type=password],input[type=search]{
  width:100%;background:var(--bg2);border:1.5px solid var(--line);color:var(--txt);border-radius:12px;padding:13px 14px;font-size:15px;outline:none}
input:focus{border-color:var(--g)}
input::placeholder{color:#5c7767}

/* hero */
.hero{text-align:center;padding:12px 0 6px}
.hero svg{width:210px;max-width:62vw;height:auto;animation:flut 5s ease-in-out infinite}
@keyframes flut{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.hero h1{font-size:30px;line-height:1.1;margin:10px 0 10px;font-weight:800;letter-spacing:-.5px}
.hero h1 em{font-style:normal;color:var(--g)}
.hero p{color:var(--mut);font-size:14.5px;margin:0 auto 20px;max-width:340px}
.ck{animation:pulse 2.4s ease-in-out infinite}
.ck2{animation-delay:.6s}.ck3{animation-delay:1.2s}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}

/* filtros e jogos */
.filtros{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 80%,transparent);padding:2px 0 8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:999px;padding:7px 14px;font-weight:700;font-size:12.5px;cursor:pointer}
.chip.on{border-color:var(--g);color:var(--g);background:rgba(39,227,111,.1)}
.dia{margin:16px 0 8px;font-size:12px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.8px}
.ev{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px;margin-bottom:10px}
.ev-top{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--mut);margin-bottom:8px}
.ev-top .lg{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-top .hr{white-space:nowrap;font-weight:700;color:var(--txt)}
.ev-t{font-weight:800;font-size:15px;margin-bottom:10px}
.ev-t span{color:var(--mut);font-weight:600;margin:0 4px}
.odds{display:grid;gap:8px}
.odds.n3{grid-template-columns:repeat(3,1fr)}
.odds.n2{grid-template-columns:repeat(2,1fr)}
.odd{background:var(--card2);border:1.5px solid var(--line);color:var(--txt);border-radius:12px;padding:9px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:all .12s}
.odd small{font-size:11px;color:var(--mut);font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.odd b{font-size:17px}
.odd.on{background:var(--g);border-color:var(--g);color:#04210F;box-shadow:0 4px 18px rgba(39,227,111,.35)}
.odd.on small{color:#0b4a24}
.odd:disabled{opacity:.35;cursor:not-allowed}
.vazio{text-align:center;color:var(--mut);padding:30px 10px;font-size:14px}

.barra{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 35%)}
.barra .in{max-width:520px;margin:0 auto;background:var(--g);color:#04210F;border-radius:16px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;box-shadow:0 10px 30px rgba(39,227,111,.35);font-weight:800}
.barra .in span{font-size:13px;font-weight:700;opacity:.8;display:block}
.barra .in b{font-size:20px}

.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-end}
.sheet{width:100%;max-width:520px;margin:0 auto;background:var(--bg2);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:86vh;overflow:auto}
.pk{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px dashed var(--line)}
.pk .x{background:none;border:0;color:var(--red);font-size:20px;cursor:pointer;padding:4px 8px}
.pk .o{font-weight:800;color:var(--g);font-size:16px}
.tot{display:flex;justify-content:space-between;align-items:center;margin:14px 0}
.tot b{font-size:26px;color:var(--g)}

/* bilhete */
.tk{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.tk-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:2px dashed var(--line)}
.code{font-weight:800;font-size:22px;letter-spacing:1.5px}
.badge{font-size:11.5px;font-weight:800;padding:5px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:.4px}
.st-pendente{background:rgba(255,194,71,.15);color:var(--amb)}
.st-validado{background:rgba(39,227,111,.16);color:var(--g)}
.st-recusado{background:rgba(255,97,97,.15);color:var(--red)}
.tk-b{padding:6px 16px}
.it{padding:11px 0;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.it .lg{font-size:11.5px;color:var(--mut)}
.it .jg{font-weight:700;margin:2px 0}
.it .pl{display:flex;justify-content:space-between;color:var(--g);font-weight:800}
.tk-f{padding:14px 16px;background:var(--card2);display:flex;justify-content:space-between;align-items:center}
.tk-f b{font-size:24px;color:var(--g)}
.tk-m{padding:10px 16px;font-size:13px;color:var(--mut);border-bottom:1px solid var(--line)}
.tk-m strong{color:var(--txt)}
.aviso{background:rgba(255,194,71,.1);border:1px solid rgba(255,194,71,.35);color:var(--amb);border-radius:12px;padding:11px 13px;font-size:13px;margin:10px 0}
.ok{background:rgba(39,227,111,.1);border:1px solid rgba(39,227,111,.35);color:var(--g);border-radius:12px;padding:11px 13px;font-size:13px;margin:10px 0}

.big{text-align:center;padding:10px 0}
.big .code{font-size:34px;color:var(--g);margin:6px 0}
.rodape{margin-top:26px;padding:14px;font-size:11.5px;color:#5f7b6b;text-align:center;line-height:1.5}

.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.gate .card{max-width:380px;text-align:center;padding:26px 20px}
.gate h1{font-size:46px;margin:0;color:var(--g)}

#toasts{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:0;right:0;z-index:99;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{background:var(--card2);border:1px solid var(--line);color:var(--txt);padding:11px 16px;border-radius:12px;font-weight:700;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:420px;animation:ti .2s ease-out}
.toast.erro{border-color:var(--red);color:#ffb1b1}
.toast.ok{border-color:var(--g);color:var(--g)}
@keyframes ti{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.tip{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700;color:var(--txt)}
a{color:var(--g)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toasts"></div>

<script>
/* =====================================================================
   CONFIGURAÇÃO — preencha DEPOIS de criar o projeto no Supabase.
   Enquanto estiver vazio, o site roda em MODO DEMONSTRAÇÃO (dados fictícios
   salvos só no seu navegador).
   ===================================================================== */
const CONFIG = {
  SUPABASE_URL: "https://lqutpolpyrbvayqsivfz.supabase.co",       // ex: "https://abcdxyz.supabase.co"
  SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxxdXRwb2xweXJidmF5cXNpdmZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzNzcxOTcsImV4cCI6MjEwNjk1MzE5N30.hMty4zPTXiJe6B0Xk_jenjpcY2Lfwz_7IkFEVbntxss",  // chave "anon public" (pode ficar no site, é pública)
};
const MODO_DEMO = !CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_ANON_KEY;

/* ---------------------------- utilidades ---------------------------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtOdd = (n) => Number(n).toFixed(2);
const fmtHora = (iso) => new Date(iso).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
const fmtDataCurta = (iso) => new Date(iso).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });
const fmtDataHora = (iso) => `${fmtDataCurta(iso)} ${fmtHora(iso)}`;
function fmtDia(iso) {
  const d = new Date(iso), h = new Date(), am = new Date(h.getTime() + 864e5);
  const igual = (a, b) => a.toDateString() === b.toDateString();
  if (igual(d, h)) return "Hoje";
  if (igual(d, am)) return "Amanhã";
  return d.toLocaleDateString("pt-BR", { weekday: "long", day: "2-digit", month: "2-digit" });
}
const EMOJI = { Futebol: "⚽", Basquete: "🏀", MMA: "🥊", "Tênis": "🎾" };
const emoji = (e) => EMOJI[e] || "🎯";
const rotulo = (i) => (i.selecao === "casa" ? i.casa : i.selecao === "fora" ? i.fora : "Empate");
const baseUrl = () => location.href.split("?")[0].split("#")[0];
function toast(msg, tipo = "") {
  const t = document.createElement("div");
  t.className = "toast " + tipo; t.textContent = msg;
  $("#toasts").appendChild(t);
  setTimeout(() => t.remove(), tipo === "erro" ? 4500 : 2600);
}
async function copiar(texto) {
  try { await navigator.clipboard.writeText(texto); }
  catch (e) {
    const ta = document.createElement("textarea"); ta.value = texto; document.body.appendChild(ta);
    ta.select(); document.execCommand("copy"); ta.remove();
  }
}
function waLink(telefone, texto) {
  let n = String(telefone || "").replace(/\D/g, "");
  if (n && n.length <= 11) n = "55" + n;
  return `https://wa.me/${n}?text=${encodeURIComponent(texto)}`;
}
function textoBilhete(b) {
  const l = [`🟢 *ZSGREEN* — Bilhete *${b.codigo}*`, `Apostador: ${b.apostador.apelido} (${b.apostador.nome})`, ""];
  for (const i of b.itens) {
    l.push(`${emoji(i.esporte_nome)} ${i.casa} x ${i.fora} — ${fmtDataHora(i.inicio)}`);
    l.push(`   ➜ ${rotulo(i)} @ ${fmtOdd(i.odd)}`);
  }
  l.push("", `Odd total: *${fmtOdd(b.odd_total)}*`, "", `Para validar: ${baseUrl()}?v=${b.codigo}`);
  return l.join("\n");
}
const ERROS = {
  ACESSO_INVALIDO: "Link inválido ou desativado. Peça um novo link ao seu supervisor.",
  BILHETE_VAZIO: "Escolha ao menos um jogo.",
  MUITOS_JOGOS: "O bilhete aceita no máximo 15 jogos.",
  EVENTO_INEXISTENTE: "Um dos jogos não está mais disponível. Atualize a lista.",
  EVENTO_JA_COMECOU: "Um dos jogos já começou (ou começa em menos de 5 min). Remova-o do bilhete.",
  EVENTO_REPETIDO: "Há dois palpites no mesmo jogo.",
  SELECAO_INVALIDA: "Palpite inválido.",
  ODD_INDISPONIVEL: "Essa odd não está disponível.",
  NAO_AUTORIZADO: "Sem permissão para isso.",
  BILHETE_NAO_ENCONTRADO: "Bilhete não encontrado.",
  BILHETE_JA_PROCESSADO: "Esse bilhete já foi validado ou recusado.",
  PRAZO_ENCERRADO: "Prazo encerrado: o primeiro jogo do bilhete já começou.",
  NAO_PODE_DESATIVAR_A_SI_MESMO: "Você não pode desativar a si mesmo.",
  CREDENCIAIS: "E-mail ou senha incorretos.",
  CONTA_SEM_ACESSO: "Essa conta não tem acesso ao painel.",
  EMAIL_EM_USO: "Já existe um login com esse e-mail.",
};
function msgErro(e) {
  const m = (e && e.message) || String(e);
  for (const k in ERROS) if (m.includes(k)) return ERROS[k];
  return m;
}

/* =====================================================================
   BACKEND DEMO — tudo no localStorage, com as MESMAS regras do servidor
   ===================================================================== */
function demoBackend() {
  const KEY = "zs_demo_db_v1", SKEY = "zs_demo_sessao";
  const HORA = 3600e3;
  const uid = () => "id" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  const FIX = [
    ["Futebol", "Brasileirão Série A", "Flamengo", "Palmeiras", [2.05, 3.30, 3.55]],
    ["Futebol", "Brasileirão Série A", "Corinthians", "São Paulo", [2.60, 3.10, 2.85]],
    ["Futebol", "Brasileirão Série A", "Grêmio", "Internacional", [2.45, 3.20, 2.95]],
    ["Futebol", "Brasileirão Série A", "Fluminense", "Botafogo", [2.70, 3.15, 2.70]],
    ["Futebol", "Brasileirão Série A", "Santos", "Vasco", [2.30, 3.25, 3.20]],
    ["Futebol", "Brasileirão Série A", "Cruzeiro", "Atlético-MG", [2.55, 3.10, 2.90]],
    ["Futebol", "Libertadores", "River Plate", "Boca Juniors", [2.40, 3.00, 3.10]],
    ["Futebol", "Premier League", "Arsenal", "Liverpool", [2.25, 3.50, 3.05]],
    ["Futebol", "Premier League", "Man City", "Chelsea", [1.65, 4.10, 4.80]],
    ["Futebol", "La Liga", "Real Madrid", "Barcelona", [2.35, 3.60, 2.90]],
    ["Futebol", "Champions League", "Bayern", "PSG", [2.10, 3.60, 3.30]],
    ["Basquete", "NBA", "Lakers", "Celtics", [2.20, 1.70]],
    ["Basquete", "NBA", "Warriors", "Heat", [1.85, 1.95]],
    ["Basquete", "NBA", "Bucks", "Nuggets", [2.00, 1.82]],
    ["MMA", "UFC (demo)", "R. Almeida", "T. Brandão", [1.55, 2.45]],
    ["MMA", "UFC (demo)", "D. Moreira", "C. Lima", [2.10, 1.75]],
    ["Tênis", "ATP (demo)", "L. Ferreira", "M. Duarte", [1.60, 2.30]],
    ["Tênis", "ATP (demo)", "P. Santos", "J. Ribeiro", [1.95, 1.85]],
  ];
  const OFFS = [0.05, 2, 3, 5, 7, 20, 22, 26, 28, 30, 45, 48, 50, 52, 70, 72, 74, 96];
  function gerarEventos() {
    const t0 = Date.now();
    return FIX.map((f, i) => ({
      id: "demo-" + i, esporte_nome: f[0], liga: f[1], casa: f[2], fora: f[3],
      inicio: new Date(t0 + OFFS[i] * HORA).toISOString(),
      odds: f[4].length === 3 ? { casa: f[4][0], empate: f[4][1], fora: f[4][2] } : { casa: f[4][0], fora: f[4][1] },
      atualizado_em: new Date(t0).toISOString(),
    }));
  }
  function seed() {
    return {
      perfis: [
        { id: "u-admin", nome: "Admin Demo", role: "admin", ativo: true, email: "admin@zsgreen.demo", senha: "admin123", telefone: null },
        { id: "u-sup1", nome: "Supervisor Demo", role: "supervisor", ativo: true, email: "super@zsgreen.demo", senha: "super123", telefone: "11999990000" },
      ],
      apostadores: [{ id: "a1", supervisor_id: "u-sup1", nome: "Carlos Silva", apelido: "Carlão", token: "demo-amigo", ativo: true, criado_em: new Date().toISOString() }],
      eventos: gerarEventos(), eventosEm: Date.now(), bilhetes: [],
    };
  }
  function load() {
    let db; try { db = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
    if (!db) db = seed();
    if (Date.now() - db.eventosEm > 12 * HORA) { db.eventos = gerarEventos(); db.eventosEm = Date.now(); }
    return db;
  }
  const save = (db) => localStorage.setItem(KEY, JSON.stringify(db));
  const perfilLogado = (db) => { const id = localStorage.getItem(SKEY); return db.perfis.find((p) => p.id === id && p.ativo) || null; };
  const exigeStaff = (db) => { const p = perfilLogado(db); if (!p) throw new Error("NAO_AUTORIZADO"); return p; };
  const exigeAdmin = (db) => { const p = exigeStaff(db); if (p.role !== "admin") throw new Error("NAO_AUTORIZADO"); return p; };
  const pub = (p) => ({ id: p.id, nome: p.nome, role: p.role, ativo: p.ativo, telefone: p.telefone, email: p.email });
  function bilheteJson(db, b) {
    const a = db.apostadores.find((x) => x.id === b.apostador_id);
    const sp = db.perfis.find((x) => x.id === a.supervisor_id);
    const vp = db.perfis.find((x) => x.id === b.validado_por);
    return {
      id: b.id, codigo: b.codigo, status: b.status, odd_total: b.odd_total, criado_em: b.criado_em,
      validado_em: b.validado_em || null, validado_por_nome: vp ? vp.nome : null,
      apostador: { nome: a.nome, apelido: a.apelido }, supervisor_nome: sp.nome,
      itens: [...b.itens].sort((x, y) => new Date(x.inicio) - new Date(y.inicio)),
    };
  }
  const achaPorToken = (db, token) => {
    const a = db.apostadores.find((x) => x.token === token && x.ativo);
    const p = a && db.perfis.find((x) => x.id === a.supervisor_id && x.ativo);
    return a && p ? a : null;
  };
  const achaBilhete = (db, cod) => db.bilhetes.find((b) => b.codigo === String(cod).trim().toUpperCase());
  const primeiroJogo = (b) => Math.min(...b.itens.map((i) => new Date(i.inicio).getTime()));
  const delay = (v) => new Promise((r) => setTimeout(() => r(v), 40));

  return {
    nome: "demo",
    async apostadorInfo(token) {
      const db = load(), a = achaPorToken(db, token); if (!a) return null;
      const p = db.perfis.find((x) => x.id === a.supervisor_id);
      return delay({ nome: a.nome, apelido: a.apelido, supervisor_nome: p.nome, supervisor_telefone: p.telefone });
    },
    async eventos() { const db = load(); save(db); return delay(db.eventos.filter((e) => new Date(e.inicio) > new Date()).sort((a, b) => new Date(a.inicio) - new Date(b.inicio))); },
    async criarBilhete(token, itens) {
      const db = load(), a = achaPorToken(db, token);
      if (!a) throw new Error("ACESSO_INVALIDO");
      if (!Array.isArray(itens) || !itens.length) throw new Error("BILHETE_VAZIO");
      if (itens.length > 15) throw new Error("MUITOS_JOGOS");
      const vistos = new Set(); let total = 1; const linhas = [];
      for (const it of itens) {
        const ev = db.eventos.find((e) => e.id === it.evento_id);
        if (!ev) throw new Error("EVENTO_INEXISTENTE");
        if (new Date(ev.inicio).getTime() < Date.now() + 5 * 60e3) throw new Error("EVENTO_JA_COMECOU");
        if (vistos.has(ev.id)) throw new Error("EVENTO_REPETIDO"); vistos.add(ev.id);
        if (!["casa", "empate", "fora"].includes(it.selecao)) throw new Error("SELECAO_INVALIDA");
        const odd = ev.odds[it.selecao]; if (!odd) throw new Error("ODD_INDISPONIVEL");
        linhas.push({ evento_id: ev.id, esporte_nome: ev.esporte_nome, liga: ev.liga, casa: ev.casa, fora: ev.fora, inicio: ev.inicio, selecao: it.selecao, odd });
        total *= odd;
      }
      const AL = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let codigo;
      do { codigo = "ZS-" + Array.from({ length: 6 }, () => AL[Math.floor(Math.random() * 32)]).join(""); } while (achaBilhete(db, codigo));
      const b = { id: uid(), codigo, apostador_id: a.id, status: "pendente", odd_total: Math.round(total * 100) / 100, criado_em: new Date().toISOString(), itens: linhas };
      db.bilhetes.push(b); save(db);
      return delay({ codigo, odd_total: b.odd_total });
    },
    async meusBilhetes(token) {
      const db = load(), a = achaPorToken(db, token); if (!a) return [];
      return delay(db.bilhetes.filter((b) => b.apostador_id === a.id).sort((x, y) => new Date(y.criado_em) - new Date(x.criado_em)).slice(0, 40).map((b) => bilheteJson(db, b)));
    },
    async login(email, senha) {
      const db = load();
      const p = db.perfis.find((x) => x.email === String(email).trim().toLowerCase() && x.senha === senha);
      if (!p) throw new Error("CREDENCIAIS");
      if (!p.ativo) throw new Error("CONTA_SEM_ACESSO");
      localStorage.setItem(SKEY, p.id); return delay(pub(p));
    },
    async sessao() { const db = load(), p = perfilLogado(db); return p ? pub(p) : null; },
    async logout() { localStorage.removeItem(SKEY); },
    async listarApostadores() {
      const db = load(), p = exigeStaff(db);
      return delay(db.apostadores.filter((a) => p.role === "admin" || a.supervisor_id === p.id).sort((x, y) => new Date(y.criado_em) - new Date(x.criado_em)));
    },
    async criarApostador(nome, apelido) {
      const db = load(), p = exigeStaff(db);
      const a = { id: uid(), supervisor_id: p.id, nome, apelido, token: uid() + uid(), ativo: true, criado_em: new Date().toISOString() };
      db.apostadores.push(a); save(db); return delay(a);
    },
    async setApostadorAtivo(id, ativo) {
      const db = load(), p = exigeStaff(db);
      const a = db.apostadores.find((x) => x.id === id && x.supervisor_id === p.id); if (a) a.ativo = ativo; save(db);
    },
    async obterBilhete(codigo) {
      const db = load(); exigeStaff(db);
      const b = achaBilhete(db, codigo); if (!b) return null;
      return delay({ ...bilheteJson(db, b), pode_validar: b.status === "pendente" && primeiroJogo(b) > Date.now(), primeiro_jogo: new Date(primeiroJogo(b)).toISOString() });
    },
    async validarBilhete(codigo) { return processa(codigo, "validado"); },
    async recusarBilhete(codigo) { return processa(codigo, "recusado"); },
    async listarBilhetesSupervisor() {
      const db = load(), p = exigeStaff(db);
      return delay(db.bilhetes.filter((b) => { const a = db.apostadores.find((x) => x.id === b.apostador_id); return b.validado_por === p.id || a.supervisor_id === p.id; })
        .sort((x, y) => new Date(y.criado_em) - new Date(x.criado_em)).slice(0, 100).map((b) => bilheteJson(db, b)));
    },
    async listarSupervisores() { const db = load(); exigeAdmin(db); return delay(db.perfis.filter((p) => p.role === "supervisor").map(pub)); },
    async criarSupervisor(d) {
      const db = load(); exigeAdmin(db);
      const email = String(d.email || "").trim().toLowerCase();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) throw new Error("E-mail inválido");
      if (String(d.senha || "").length < 6) throw new Error("A senha precisa ter ao menos 6 caracteres");
      if (db.perfis.some((p) => p.email === email)) throw new Error("EMAIL_EM_USO");
      db.perfis.push({ id: uid(), nome: d.nome, role: "supervisor", ativo: true, email, senha: d.senha, telefone: d.telefone ? String(d.telefone).replace(/\D/g, "") : null });
      save(db); return delay({ ok: true });
    },
    async setSupervisorAtivo(id, ativo) {
      const db = load(), me = exigeAdmin(db);
      if (id === me.id) throw new Error("NAO_PODE_DESATIVAR_A_SI_MESMO");
      const p = db.perfis.find((x) => x.id === id && x.role === "supervisor"); if (p) p.ativo = ativo; save(db);
    },
    async adminListarBilhetes() {
      const db = load(); exigeAdmin(db);
      return delay([...db.bilhetes].sort((x, y) => new Date(y.criado_em) - new Date(x.criado_em)).slice(0, 300).map((b) => bilheteJson(db, b)));
    },
    async sincronizarJogos() { const db = load(); exigeAdmin(db); db.eventos = gerarEventos(); db.eventosEm = Date.now(); save(db); return delay({ mensagem: "Demonstração: jogos fictícios regenerados.", detalhe: [] }); },
    resetar() { localStorage.removeItem(KEY); localStorage.removeItem(SKEY); },
  };
  function processa(codigo, novo) {
    const db = load(), p = exigeStaff(db), b = achaBilhete(db, codigo);
    if (!b) throw new Error("BILHETE_NAO_ENCONTRADO");
    if (b.status !== "pendente") throw new Error("BILHETE_JA_PROCESSADO");
    if (novo === "validado" && primeiroJogo(b) <= Date.now()) throw new Error("PRAZO_ENCERRADO");
    b.status = novo; b.validado_por = p.id; b.validado_em = new Date().toISOString(); save(db);
    return Promise.resolve(bilheteJson(db, b));
  }
}

/* =====================================================================
   BACKEND REAL — Supabase
   ===================================================================== */
async function supabaseBackend() {
  await new Promise((ok, falha) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
    s.onload = ok; s.onerror = () => falha(new Error("Não consegui carregar o Supabase. Verifique a internet."));
    document.head.appendChild(s);
  });
  const sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  const rpc = async (fn, args) => { const { data, error } = await sb.rpc(fn, args); if (error) throw new Error(error.message); return data; };
  const tab = async (q) => { const { data, error } = await q; if (error) throw new Error(error.message); return data; };
  async function perfilAtual() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) return null;
    const { data } = await sb.from("profiles").select("id,nome,role,telefone,ativo").eq("id", session.user.id).maybeSingle();
    return data && data.ativo ? data : null;
  }
  async function chamaFuncao(nome, corpo) {
    const { data, error } = await sb.functions.invoke(nome, { body: corpo });
    if (error) {
      let detalhe = error.message;
      try { const j = await error.context.json(); if (j && (j.erro || j.message)) detalhe = j.erro || j.message; } catch (e) {}
      throw new Error(detalhe);
    }
    return data;
  }
  return {
    nome: "supabase",
    apostadorInfo: (token) => rpc("app_apostador", { p_token: token }),
    eventos: () => tab(sb.from("eventos").select("*").gt("inicio", new Date().toISOString()).order("inicio").limit(600)),
    criarBilhete: (token, itens) => rpc("criar_bilhete", { p_token: token, p_itens: itens }),
    meusBilhetes: (token) => rpc("meus_bilhetes", { p_token: token }),
    async login(email, senha) {
      const { error } = await sb.auth.signInWithPassword({ email: String(email).trim(), password: senha });
      if (error) throw new Error("CREDENCIAIS");
      const p = await perfilAtual();
      if (!p) { await sb.auth.signOut(); throw new Error("CONTA_SEM_ACESSO"); }
      return p;
    },
    sessao: perfilAtual,
    logout: () => sb.auth.signOut(),
    listarApostadores: () => tab(sb.from("apostadores").select("id,nome,apelido,token,ativo,criado_em,supervisor_id").order("criado_em", { ascending: false })),
    async criarApostador(nome, apelido) {
      const { data: { session } } = await sb.auth.getSession();
      return tab(sb.from("apostadores").insert({ supervisor_id: session.user.id, nome, apelido }).select().single());
    },
    async setApostadorAtivo(id, ativo) { await tab(sb.from("apostadores").update({ ativo }).eq("id", id)); },
    obterBilhete: (codigo) => rpc("obter_bilhete", { p_codigo: codigo }),
    validarBilhete: (codigo) => rpc("validar_bilhete", { p_codigo: codigo }),
    recusarBilhete: (codigo) => rpc("recusar_bilhete", { p_codigo: codigo }),
    listarBilhetesSupervisor: () => rpc("listar_bilhetes_supervisor"),
    listarSupervisores: () => tab(sb.from("profiles").select("id,nome,role,telefone,ativo,criado_em").eq("role", "supervisor").order("nome")),
    async criarSupervisor(d) { await chamaFuncao("criar-supervisor", d); },
    async setSupervisorAtivo(id, ativo) { await rpc("admin_set_ativo", { p_id: id, p_ativo: ativo }); },
    adminListarBilhetes: () => rpc("admin_listar_bilhetes"),
    async sincronizarJogos() {
      const r = await chamaFuncao("sync-odds", { force: true });
      const lista = r.resultado || [];
      const ok = lista.filter((x) => x.eventos !== undefined).length;
      const detalhe = lista.map((x) => (x.eventos !== undefined ? `${x.esporte}: ${x.eventos} jogos` : x.erro ? `${x.esporte}: erro ${x.erro} da API` : `${x.esporte}: pulado (${x.pulado})`));
      if (!lista.length) detalhe.push("Nenhuma competição da lista está ativa na The Odds API agora.");
      return { mensagem: `Atualizado: ${ok} competição(ões). Créditos restantes da API: ${r.creditos_restantes ?? "?"}.`, detalhe };
    },
  };
}

async function boot() {
  try { S.be = MODO_DEMO ? demoBackend() : await supabaseBackend(); }
  catch (e) { app.innerHTML = pageHtml(`<div class="card"><h2>Ops</h2><p class="mut">${esc(msgErro(e))}</p></div>`); return; }

  S.token = q.get("a"); S.codigoPendente = q.get("v");
  if (localStorage.getItem("zs_18") !== "1") { S.view = "gate"; return render(); }
  await iniciar();
}
async function iniciar() {
  try {
    if (S.token) {
      S.amigo = await S.be.apostadorInfo(S.token);
      if (!S.amigo) { S.view = "linkInvalido"; return render(); }
      try { S.picks = JSON.parse(localStorage.getItem("zs_picks_" + S.token)) || {}; } catch (e) { S.picks = {}; }
      S.eventos = await S.be.eventos();
      S.picks = Object.fromEntries(Object.entries(S.picks).filter(([id]) => S.eventos.some((e) => e.id === id)));
      S.view = "amigo"; S.abaAmigo = "jogos"; return render();
    }
    S.perfil = await S.be.sessao();
    if (S.perfil) {
      S.view = "staff"; S.abaStaff = "validar";
      if (S.codigoPendente) { S.codigoBusca = S.codigoPendente; await buscarBilhete(); }
      return render();
    }
    S.view = S.codigoPendente ? "login" : "home"; render();
  } catch (e) { toast(msgErro(e), "erro"); S.view = "home"; render(); }
}

  if (v === "gate") app.innerHTML = viewGate();

  else app.innerHTML = pageHtml(`<div class="vazio">Carregando…</div>`);

}

  const termo = S.busca.trim().toLowerCase();
  const lista = S.eventos.filter((e) => (S.esporte === "Todos" || e.esporte_nome === S.esporte) &&
    (!termo || `${e.casa} ${e.fora} ${e.liga}`.toLowerCase().includes(termo)));
  if (!lista.length) { el.innerHTML = `<div class="vazio">Nenhum jogo encontrado.<br><span class="sm">Se a lista estiver vazia, o admin ainda precisa atualizar os jogos.</span></div>`; return; }
  let html = "", dia = "";
  const limite = Date.now() + 5 * 60e3;
  for (const e of lista) {
    const d = fmtDia(e.inicio);
    if (d !== dia) { dia = d; html += `<div class="dia">${esc(d)}</div>`; }
    const off = new Date(e.inicio).getTime() < limite;
    const sels = e.odds.empate ? [["casa", "1"], ["empate", "X"], ["fora", "2"]] : [["casa", e.casa], ["fora", e.fora]];
    html += `<div class="ev"><div class="ev-top"><span class="lg">${emoji(e.esporte_nome)} ${esc(e.liga || "")}</span><span class="hr">${off ? "Encerrado" : fmtHora(e.inicio)}</span></div>
      <div class="ev-t">${esc(e.casa)}<span>x</span>${esc(e.fora)}</div>
      <div class="odds ${sels.length === 3 ? "n3" : "n2"}">${sels.map(([s, r]) =>
        `<button class="odd ${S.picks[e.id] === s ? "on" : ""}" ${off ? "disabled" : ""} data-act="pick" data-ev="${esc(e.id)}" data-sel="${s}"><small>${esc(r)}</small><b>${fmtOdd(e.odds[s])}</b></button>`).join("")}</div></div>`;
  }
  el.innerHTML = html;
}
function oddTotalPicks() {
  let t = 1;
  for (const [id, sel] of Object.entries(S.picks)) { const e = S.eventos.find((x) => x.id === id); if (e) t *= e.odds[sel]; }
  return Math.round(t * 100) / 100;
}
function drawBarra() {
  const el = $("#barra"); if (!el) return;
  const n = Object.keys(S.picks).length;
  if (!n || S.abaAmigo !== "jogos") { el.innerHTML = ""; return; }
  el.innerHTML = `<div class="barra"><div class="in" data-act="abrir-sheet"><div><span>${n} ${n === 1 ? "jogo" : "jogos"} no bilhete</span>Ver bilhete</div><b>${fmtOdd(oddTotalPicks())}</b></div></div>`;
}
function drawSheet() {
  const el = $("#sheet"); if (!el) return;
  if (!S.sheet) { el.innerHTML = ""; return; }
  const itens = Object.entries(S.picks).map(([id, sel]) => ({ e: S.eventos.find((x) => x.id === id), sel })).filter((x) => x.e);
  el.innerHTML = `<div class="sheet-bg" data-act="fechar-sheet-bg"><div class="sheet">
    <div class="row sp"><h3 style="margin:0">Meu bilhete</h3><button class="btn g xs" data-act="fechar-sheet">Fechar</button></div>
    ${itens.map(({ e, sel }) => `<div class="pk"><div class="grow"><div class="sm mut">${emoji(e.esporte_nome)} ${esc(e.liga || "")} · ${fmtDataHora(e.inicio)}</div>
      <div style="font-weight:700">${esc(e.casa)} x ${esc(e.fora)}</div>
      <div class="sm" style="color:var(--g)">➜ ${esc(rotulo({ selecao: sel, casa: e.casa, fora: e.fora }))}</div></div>
      <div class="o">${fmtOdd(e.odds[sel])}</div><button class="x" data-act="rm-pick" data-ev="${esc(e.id)}">✕</button></div>`).join("")}
    <div class="tot"><span class="mut">Odd total</span><b>${fmtOdd(oddTotalPicks())}</b></div>
    <div class="aviso">O bilhete só vale depois que um supervisor validar. Isso precisa acontecer antes do primeiro jogo começar.</div>
    <div class="btns"><button class="btn g" data-act="limpar-picks">Limpar</button><button class="btn p" data-act="gerar-bilhete" style="flex:2">Gerar bilhete</button></div>
  </div></div>`;
}
function salvarPicks() { try { localStorage.setItem("zs_picks_" + S.token, JSON.stringify(S.picks)); } catch (e) {} }

function htmlBilhete(b, { staff = false, acoes = "" } = {}) {
  const st = { pendente: "Pendente", validado: "Validado", recusado: "Recusado" }[b.status];
  const meta = staff
    ? `<div class="tk-m">Apostador: <strong>${esc(b.apostador.apelido)}</strong> (${esc(b.apostador.nome)}) · Supervisor: <strong>${esc(b.supervisor_nome)}</strong></div>` : "";
  const val = b.validado_por_nome ? `<div class="tk-m">${b.status === "recusado" ? "Recusado" : "Validado"} por <strong>${esc(b.validado_por_nome)}</strong> em ${fmtDataHora(b.validado_em)}</div>` : "";
  return `<div class="tk"><div class="tk-h"><div class="code">${esc(b.codigo)}</div><span class="badge st-${b.status}">${st}</span></div>${meta}
    <div class="tk-b">${b.itens.map((i) => `<div class="it"><div class="lg">${emoji(i.esporte_nome)} ${esc(i.liga || "")} · ${fmtDataHora(i.inicio)}</div>
      <div class="jg">${esc(i.casa)} x ${esc(i.fora)}</div><div class="pl"><span>➜ ${esc(rotulo(i))}</span><span>${fmtOdd(i.odd)}</span></div></div>`).join("")}</div>
    ${val}<div class="tk-f"><span class="mut">Odd total</span><b>${fmtOdd(b.odd_total)}</b></div>${acoes ? `<div style="padding:12px 16px" class="btns">${acoes}</div>` : ""}</div>`;
}
function htmlMeusBilhetes() {
  if (!S.bilhetesAmigo.length) return `<div class="vazio">Você ainda não gerou nenhum bilhete.</div>`;
  return S.bilhetesAmigo.map((b) => htmlBilhete(b, { acoes: b.status === "pendente" ? `<button class="btn p" data-act="wa-bilhete" data-cod="${esc(b.codigo)}">Enviar para validação</button>` : "" })).join("");
}
function viewBilheteGerado() {
  const b = S.ultimo;
  return pageHtml(`<div class="top">${logoHtml}<span></span></div>
    <div class="big"><div class="mut">Bilhete gerado</div><div class="code">${esc(b.codigo)}</div><span class="badge st-pendente">Aguardando validação</span></div>
    <div class="aviso">Falta só um passo: envie o bilhete para um supervisor validar <b>antes do primeiro jogo começar</b>.</div>
    <div class="btns" style="flex-direction:column;margin-bottom:14px">
      <button class="btn p" data-act="wa-bilhete" data-cod="${esc(b.codigo)}">Enviar no WhatsApp</button>
      <button class="btn s" data-act="copiar-bilhete" data-cod="${esc(b.codigo)}">Copiar texto do bilhete</button></div>
    ${htmlBilhete(b)}
    <button class="btn g" data-act="voltar-jogos">Voltar aos jogos</button>`);
}

/* ------------------------------ STAFF ------------------------------ */
function viewStaff() {
  const adm = S.perfil.role === "admin";
  const abas = [["validar", "Validar"], ["apostadores", "Apostadores"], ["bilhetes", "Bilhetes"]];
  if (adm) abas.push(["supervisores", "Supervisores"], ["todos", "Todos os bilhetes"], ["jogos", "Jogos"]);
  const tabs = `<div class="tabs">${abas.map(([k, n]) => `<button class="tab ${S.abaStaff === k ? "on" : ""}" data-act="tab-staff" data-tab="${k}">${n}</button>`).join("")}</div>`;
  const fn = { validar: stValidar, apostadores: stApostadores, bilhetes: stBilhetes, supervisores: stSupervisores, todos: stTodos, jogos: stJogos }[S.abaStaff];
  return pageHtml(`<div class="top">${logoHtml}<div class="row"><div class="hello"><strong>${esc(S.perfil.nome)}</strong>${adm ? "Admin" : "Supervisor"}</div><button class="btn g xs" data-act="sair">Sair</button></div></div>${tabs}${fn()}`);
}
function stValidar() {
  let res = "";
  if (S.bilheteAberto) {
    const b = S.bilheteAberto;
    let acoes = "";
    if (b.status === "pendente" && b.pode_validar) acoes = `<button class="btn d" data-act="recusar" data-cod="${esc(b.codigo)}">Recusar</button><button class="btn p" style="flex:2" data-act="validar" data-cod="${esc(b.codigo)}">Validar bilhete</button>`;
    else if (b.status === "validado") acoes = `<button class="btn s" data-act="wa-comprovante" data-cod="${esc(b.codigo)}">Enviar comprovante no WhatsApp</button>`;
    const aviso = b.status === "pendente" && !b.pode_validar ? `<div class="aviso">Prazo encerrado: o primeiro jogo desse bilhete já começou. Não dá mais para validar.</div>` : "";
    res = aviso + htmlBilhete(b, { staff: true, acoes });
  } else if (S.buscou) res = `<div class="vazio">Bilhete não encontrado. Confira o código.</div>`;
  return `<div class="card"><h3>Validar bilhete</h3><form data-form="buscar"><div class="row">
    <input type="text" id="cod" class="grow" placeholder="ZS-XXXXXX" value="${esc(S.codigoBusca)}" autocapitalize="characters" autocomplete="off">
    <button class="btn p" style="width:auto" type="submit">Buscar</button></div></form>
    <p class="mut sm" style="margin:10px 0 0">Ou toque no link que o apostador mandou no WhatsApp.</p></div>${res}`;
}
function linkAmigo(token) { return `${baseUrl()}?a=${token}`; }
function stApostadores() {
  const lista = S.apostadores.map((a) => `<div class="card"><div class="row sp"><div class="grow"><div style="font-weight:800;font-size:16px">${esc(a.apelido)} ${a.ativo ? "" : '<span class="badge st-recusado">inativo</span>'}</div><div class="mut sm">${esc(a.nome)}</div></div></div>
    <div class="btns" style="margin-top:12px"><button class="btn s xs" data-act="copiar-link" data-token="${esc(a.token)}">Copiar link</button>
    <button class="btn p xs" data-act="wa-link" data-token="${esc(a.token)}" data-ap="${esc(a.apelido)}">Enviar no WhatsApp</button>
    <button class="btn g xs" data-act="toggle-apostador" data-id="${esc(a.id)}" data-ativo="${a.ativo ? 1 : 0}">${a.ativo ? "Desativar" : "Ativar"}</button></div></div>`).join("");
  return `<div class="card"><h3>Cadastrar apostador</h3><form data-form="apostador">
    <label for="ap-nome">Nome</label><input id="ap-nome" type="text" placeholder="Nome completo" required>
    <label for="ap-apelido">Apelido</label><input id="ap-apelido" type="text" placeholder="Como aparece nos bilhetes" required>
    <button class="btn p" style="margin-top:14px" type="submit">Cadastrar e gerar link</button></form></div>
    ${lista || `<div class="vazio">Nenhum apostador cadastrado ainda.</div>`}`;
}
function stBilhetes() {
  const fs = [["pendente", "Pendentes"], ["validado", "Validados"], ["recusado", "Recusados"], ["todos", "Todos"]];
  const lista = S.bilhetesStaff.filter((b) => S.filtroBil === "todos" || b.status === S.filtroBil);
  return `<div class="chips" style="padding-top:0">${fs.map(([k, n]) => `<button class="chip ${S.filtroBil === k ? "on" : ""}" data-act="filtro-bil" data-f="${k}">${n}</button>`).join("")}</div>
    <p class="mut sm">Mostra os bilhetes que você validou e os pendentes dos seus apostadores.</p>
    ${lista.map((b) => resumoBilhete(b)).join("") || `<div class="vazio">Nada por aqui.</div>`}`;
}
function resumoBilhete(b) {
  return `<div class="card" data-act="abrir-bilhete" data-cod="${esc(b.codigo)}" style="cursor:pointer"><div class="row sp"><div class="code" style="font-size:18px">${esc(b.codigo)}</div><span class="badge st-${b.status}">${b.status}</span></div>
    <div class="mut sm" style="margin-top:6px">${esc(b.apostador.apelido)} · ${b.itens.length} ${b.itens.length === 1 ? "jogo" : "jogos"} · odd <b style="color:var(--g)">${fmtOdd(b.odd_total)}</b> · ${fmtDataHora(b.criado_em)}</div>
    ${b.validado_por_nome ? `<div class="mut sm">por ${esc(b.validado_por_nome)}</div>` : ""}</div>`;
}
function stSupervisores() {
  const lista = S.supervisores.map((p) => `<div class="card"><div class="row sp"><div class="grow"><div style="font-weight:800">${esc(p.nome)} ${p.ativo ? "" : '<span class="badge st-recusado">inativo</span>'}</div>
    <div class="mut sm">${esc(p.email || "")}${p.telefone ? " · " + esc(p.telefone) : ""}</div></div>
    <button class="btn g xs" data-act="toggle-supervisor" data-id="${esc(p.id)}" data-ativo="${p.ativo ? 1 : 0}">${p.ativo ? "Desativar" : "Ativar"}</button></div></div>`).join("");
  return `<div class="card"><h3>Novo supervisor</h3><form data-form="supervisor">
    <label for="sp-nome">Nome</label><input id="sp-nome" type="text" required>
    <label for="sp-email">E-mail (é o login)</label><input id="sp-email" type="email" required>
    <label for="sp-senha">Senha (mín. 6)</label><input id="sp-senha" type="text" required minlength="6">
    <label for="sp-tel">WhatsApp (opcional)</label><input id="sp-tel" type="text" placeholder="11 99999-9999">
    <button class="btn p" style="margin-top:14px" type="submit">Criar supervisor</button></form></div>
    ${lista || `<div class="vazio">Nenhum supervisor criado ainda.</div>`}`;
}
function stTodos() { return `<p class="mut sm">Todos os bilhetes, com o login de quem validou.</p>${S.bilhetesAdmin.map((b) => resumoBilhete(b)).join("") || `<div class="vazio">Nenhum bilhete ainda.</div>`}`; }
function stJogos() {
  const si = S.syncInfo;
  const bloco = si ? `<div class="${si.erro ? "aviso" : "ok"}">${esc(si.erro || si.mensagem)}${(si.detalhe || []).length ? `<br><span class="sm">${si.detalhe.map(esc).join("<br>")}</span>` : ""}</div>` : "";
  return `<div class="card"><h3>Jogos e odds</h3>${bloco}<p class="mut" style="margin:0 0 12px">${S.eventos.length} jogos futuros na base.${S.ultimaSync ? `<br>Última atualização: ${esc(S.ultimaSync)}` : ""}</p>
    <button class="btn p" data-act="sync-jogos">Atualizar jogos agora</button>
    <p class="mut sm" style="margin:12px 0 0">${MODO_DEMO ? "No modo demonstração os jogos são fictícios." : "Cada atualização gasta créditos da API de odds (plano grátis: 500 por mês). Há também uma atualização automática a cada 6 horas."}</p></div>`;
}

/* ----------------------------- ações ----------------------------- */
async function buscarBilhete() {
  S.buscou = true;
  try { S.bilheteAberto = await S.be.obterBilhete(S.codigoBusca.trim().toUpperCase()); }
  catch (e) { S.bilheteAberto = null; toast(msgErro(e), "erro"); }
}
async function carregaAba() {
  try {
    if (S.abaStaff === "apostadores") S.apostadores = await S.be.listarApostadores();
    if (S.abaStaff === "bilhetes") S.bilhetesStaff = await S.be.listarBilhetesSupervisor();
    if (S.abaStaff === "supervisores") S.supervisores = await S.be.listarSupervisores();
    if (S.abaStaff === "todos") S.bilhetesAdmin = await S.be.adminListarBilhetes();
    if (S.abaStaff === "jogos") {
      S.eventos = await S.be.eventos();
      const t = S.eventos.map((e) => e.atualizado_em).filter(Boolean).sort().pop();
      S.ultimaSync = t ? fmtDataHora(t) : "";
    }
  } catch (e) { toast(msgErro(e), "erro"); }
}
async function acao(btn) {
  const a = btn.dataset.act, d = btn.dataset;
  try {
    switch (a) {
      case "aceitar-18": localStorage.setItem("zs_18", "1"); return iniciar();
      case "recusar-18": app.innerHTML = pageHtml(`<div class="vazio" style="padding-top:80px">Esse conteúdo não é para menores de 18 anos.</div>`); return;
      case "resetar-demo": S.be.resetar(); toast("Demonstração zerada", "ok"); return iniciar();
      case "entrar-staff": S.view = "login"; return render();
      case "voltar-home": S.view = "home"; return render();
      case "sair": await S.be.logout(); S.perfil = null; S.bilheteAberto = null; S.view = "home"; return render();
      // amigo
      case "tab-amigo":
        S.abaAmigo = d.tab; S.sheet = false;
        if (d.tab === "meus") S.bilhetesAmigo = await S.be.meusBilhetes(S.token);
        return render();
      case "chip": S.esporte = d.esp; drawChips(); return drawLista();
      case "pick": {
        const cur = S.picks[d.ev];
        if (cur === d.sel) delete S.picks[d.ev];
        else { if (!cur && Object.keys(S.picks).length >= 15) return toast("Máximo de 15 jogos por bilhete", "erro"); S.picks[d.ev] = d.sel; }
        salvarPicks(); drawLista(); return drawBarra();
      }
      case "abrir-sheet": S.sheet = true; return drawSheet();
      case "fechar-sheet": S.sheet = false; return drawSheet();
      case "rm-pick": delete S.picks[d.ev]; salvarPicks(); if (!Object.keys(S.picks).length) S.sheet = false; drawSheet(); drawLista(); return drawBarra();
      case "limpar-picks": S.picks = {}; salvarPicks(); S.sheet = false; drawSheet(); drawLista(); return drawBarra();
      case "gerar-bilhete": {
        btn.disabled = true;
        const itens = Object.entries(S.picks).map(([evento_id, selecao]) => ({ evento_id, selecao }));
        try {
          const r = await S.be.criarBilhete(S.token, itens);
          const lista = await S.be.meusBilhetes(S.token);
          S.bilhetesAmigo = lista; S.ultimo = lista.find((b) => b.codigo === r.codigo);
          S.picks = {}; salvarPicks(); S.sheet = false; S.view = "bilheteGerado"; return render();
        } catch (e) { btn.disabled = false; toast(msgErro(e), "erro"); if (/EVENTO/.test(e.message)) { S.eventos = await S.be.eventos(); drawLista(); drawSheet(); } return; }
      }
      case "voltar-jogos": S.view = "amigo"; S.abaAmigo = "jogos"; S.eventos = await S.be.eventos(); return render();
      case "wa-bilhete": {
        const b = S.bilhetesAmigo.find((x) => x.codigo === d.cod) || S.ultimo;
        window.open(waLink(S.amigo.supervisor_telefone, textoBilhete(b)), "_blank"); return;
      }
      case "copiar-bilhete": { const b = S.bilhetesAmigo.find((x) => x.codigo === d.cod) || S.ultimo; await copiar(textoBilhete(b)); return toast("Texto copiado", "ok"); }
      // staff
      case "tab-staff": S.abaStaff = d.tab; await carregaAba(); return render();
      case "abrir-bilhete": S.codigoBusca = d.cod; S.abaStaff = "validar"; await buscarBilhete(); return render();
      case "validar": {
        if (!confirm(`Validar o bilhete ${d.cod}? Ele ficará vinculado ao seu login.`)) return;
        await S.be.validarBilhete(d.cod); toast("Bilhete validado", "ok");
        S.bilheteAberto = await S.be.obterBilhete(d.cod); return render();
      }
      case "recusar": {
        if (!confirm(`Recusar o bilhete ${d.cod}?`)) return;
        await S.be.recusarBilhete(d.cod); toast("Bilhete recusado", "ok");
        S.bilheteAberto = await S.be.obterBilhete(d.cod); return render();
      }
      case "wa-comprovante": {
        const b = S.bilheteAberto;
        const t = `✅ *ZSGREEN* — Bilhete *${b.codigo}* validado por ${b.validado_por_nome} em ${fmtDataHora(b.validado_em)}.\nOdd total: *${fmtOdd(b.odd_total)}*`;
        window.open(waLink("", t), "_blank"); return;
      }
      case "copiar-link": await copiar(linkAmigo(d.token)); return toast("Link copiado", "ok");
      case "wa-link": window.open(waLink("", `Oi ${d.ap}! Seu link pessoal do ZSGREEN: ${linkAmigo(d.token)}\nGuarde esse link: é o seu acesso.`), "_blank"); return;
      case "toggle-apostador": await S.be.setApostadorAtivo(d.id, d.ativo !== "1"); await carregaAba(); return render();
      case "filtro-bil": S.filtroBil = d.f; return render();
      case "toggle-supervisor": await S.be.setSupervisorAtivo(d.id, d.ativo !== "1"); await carregaAba(); return render();
      case "sync-jogos": {
        btn.disabled = true; btn.textContent = "Atualizando…";
        try { const r = await S.be.sincronizarJogos(); S.syncInfo = r; toast(r.mensagem, "ok"); }
        catch (e) { S.syncInfo = { erro: msgErro(e) }; }
        await carregaAba(); return render();
      }
    }
  } catch (e) { toast(msgErro(e), "erro"); render(); }
}
async function enviar(form) {
  const f = form.dataset.form;
  try {
    if (f === "login") {
      S.perfil = await S.be.login($("#lg-email").value, $("#lg-senha").value);
      S.view = "staff"; S.abaStaff = "validar";
      if (S.codigoPendente) { S.codigoBusca = S.codigoPendente; await buscarBilhete(); }
      return render();
    }
    if (f === "buscar") { S.codigoBusca = $("#cod").value; await buscarBilhete(); return render(); }
    if (f === "apostador") {
      const ap = await S.be.criarApostador($("#ap-nome").value.trim(), $("#ap-apelido").value.trim());
      toast("Apostador cadastrado. Envie o link a ele!", "ok"); await carregaAba(); return render();
    }
    if (f === "supervisor") {
      await S.be.criarSupervisor({ nome: $("#sp-nome").value.trim(), email: $("#sp-email").value.trim(), senha: $("#sp-senha").value, telefone: $("#sp-tel").value });
      toast("Supervisor criado", "ok"); await carregaAba(); return render();
    }
  } catch (e) { toast(msgErro(e), "erro"); }
}

document.addEventListener("click", (ev) => {
  const bg = ev.target.closest('[data-act="fechar-sheet-bg"]');
  if (bg && ev.target === bg) { S.sheet = false; return drawSheet(); }
  const el = ev.target.closest("[data-act]");
  if (el && el.dataset.act !== "fechar-sheet-bg") acao(el);
});
document.addEventListener("submit", (ev) => { const f = ev.target.closest("form[data-form]"); if (f) { ev.preventDefault(); enviar(f); } });
document.addEventListener("input", (ev) => { if (ev.target.id === "busca") { S.busca = ev.target.value; drawLista(); } });

boot();
</script>
</body>
</html>
