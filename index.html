<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2BC866">
<title>ZSGREEN</title>
<script>document.documentElement.dataset.tema = localStorage.getItem("zs_tema") || "claro";</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232BC866'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11' stroke='%2304281A' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF5F0; --bg2:#E3EEE6; --card:#FFFFFF; --card2:#F1F7F3; --line:#D6E5DA;
  --txt:#12281B; --mut:#587264; --g:#2BC866; --gt:#0C7F3A; --gink:#04281A;
  --red:#D93636; --amb:#935F00; --ambbg:rgba(245,166,35,.16);
  --glow:rgba(43,200,102,.30); --shadow:0 1px 8px rgba(18,40,27,.07); --heroglow:rgba(43,200,102,.20);
  --r:14px; --paper:#FFFDF3; --blue:#1D4ED8;
}
html[data-tema="escuro"]{
  --bg:#0E2219; --bg2:#12291E; --card:#173026; --card2:#1D3A2D; --line:#2A5440;
  --txt:#EAF7EF; --mut:#9DBBA8; --g:#34D87A; --gt:#4BE88C; --gink:#04210F;
  --red:#FF7A7A; --amb:#FFC247; --ambbg:rgba(255,194,71,.13);
  --glow:rgba(52,216,122,.30); --shadow:0 2px 12px rgba(0,0,0,.25); --heroglow:rgba(52,216,122,.14);
  --paper:#1A3328; --blue:#8DB9FF;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  background:radial-gradient(800px 360px at 50% -130px,var(--heroglow),transparent 70%),var(--bg);
  color:var(--txt);font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,sans-serif;
  padding-bottom:env(safe-area-inset-bottom,0px);line-height:1.4;
}
button,input,select{font-family:inherit}
.wrap{max-width:520px;margin:0 auto;padding:0 14px 120px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(12px + env(safe-area-inset-top,0px)) 0 8px}
.logo{display:inline-flex;align-items:center;gap:7px;font-weight:800;font-size:18px;letter-spacing:.2px}
.logo b{color:var(--gt)}
.logo svg{width:25px;height:25px}
.hello{font-size:12px;color:var(--mut);text-align:right;line-height:1.25}
.hello strong{color:var(--txt);font-size:13.5px;display:block}
.iconbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:15px;line-height:1;flex:none}
.demo{margin:0 -14px 4px;padding:6px 14px;background:var(--ambbg);color:var(--amb);font-size:11.5px;font-weight:700;text-align:center}

.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:999px;padding:8px 15px;font-weight:700;font-size:13px;cursor:pointer}
.tab.on{background:var(--g);color:var(--gink);border-color:var(--g)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:11px;box-shadow:var(--shadow)}
.card h2,.card h3{margin:0 0 10px;font-size:16px}
.mut{color:var(--mut);font-size:13px}
.sm{font-size:12px}
.row{display:flex;gap:10px;align-items:center}
.row.sp{justify-content:space-between}
.grow{flex:1;min-width:0}

.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;font-size:14.5px;cursor:pointer;width:100%;transition:transform .08s,filter .15s}
.btn:active{transform:scale(.98)}
.btn.p{background:var(--g);color:var(--gink);box-shadow:0 5px 18px var(--glow)}
.btn.s{background:transparent;color:var(--gt);border:1.5px solid var(--g)}
.btn.d{background:transparent;color:var(--red);border:1.5px solid var(--red)}
.btn.g{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.btn.xs{width:auto;padding:7px 11px;font-size:12.5px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1}

label{display:block;font-size:11.5px;font-weight:800;color:var(--mut);margin:11px 0 5px;text-transform:uppercase;letter-spacing:.5px}
label:first-child{margin-top:0}
input[type=text],input[type=email],input[type=password],input[type=search],input[type=number],select{
  width:100%;background:var(--card2);border:1.5px solid var(--line);color:var(--txt);border-radius:12px;padding:12px 13px;font-size:15px;outline:none}
input:focus,select:focus{border-color:var(--g)}
input::placeholder{color:var(--mut);opacity:.7}

/* avisos e destaques */
.hscroll{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px;scrollbar-width:none;scroll-snap-type:x proximity}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{scroll-snap-align:start}
.bn{flex:none;min-width:80%;max-width:80%;border-radius:var(--r);padding:12px 14px;border:1px solid var(--line)}
.bn b{display:block;font-size:14.5px;margin-bottom:2px}
.bn span{font-size:12.5px;color:var(--mut)}
.bn.verde{background:linear-gradient(135deg,rgba(43,200,102,.28),rgba(43,200,102,.07));border-color:rgba(43,200,102,.5)}
.bn.amarelo{background:linear-gradient(135deg,rgba(245,166,35,.30),rgba(245,166,35,.07));border-color:rgba(245,166,35,.55)}
.bn.azul{background:linear-gradient(135deg,rgba(59,130,246,.26),rgba(59,130,246,.06));border-color:rgba(59,130,246,.5)}
.bn.roxo{background:linear-gradient(135deg,rgba(139,92,246,.26),rgba(139,92,246,.06));border-color:rgba(139,92,246,.5)}
.sec-t{margin:6px 0 7px;font-size:12px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.7px}

/* filtros */
.filtros{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 82%,transparent);padding:2px 0 6px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:999px;padding:6px 13px;font-weight:700;font-size:12.5px;cursor:pointer}
.chip.on{border-color:var(--g);color:var(--gt);background:rgba(43,200,102,.13)}
.dia{margin:12px 0 6px;font-size:11.5px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.8px}

/* jogo compacto */
.ev{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;margin-bottom:7px;box-shadow:var(--shadow);
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 10px;align-items:center}
.ev.dest{border-color:var(--g)}
.ev.vert{grid-template-columns:minmax(0,1fr);flex:none;width:292px;margin-bottom:0}
.ev-meta{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--mut);margin-bottom:1px;white-space:nowrap;overflow:hidden}
.ev-meta .lg{overflow:hidden;text-overflow:ellipsis}
.ev-meta b{color:var(--txt);flex:none}
.ev-t{font-size:13.5px;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.odds{display:flex;gap:5px}
.odd{width:54px;background:var(--card2);border:1.5px solid var(--line);color:var(--txt);border-radius:10px;padding:5px 2px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;line-height:1.15;transition:all .1s}
.odd small{font-size:10px;color:var(--mut);font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.odd b{font-size:14.5px}
.odd.on{background:var(--g);border-color:var(--g);color:var(--gink);box-shadow:0 3px 12px var(--glow)}
.odd.on small{color:var(--gink);opacity:.75}
.odd:disabled{opacity:.35;cursor:not-allowed}
.ev.vert .odds .odd{flex:1;width:auto}
.mais{background:var(--card2);border:1px solid var(--line);color:var(--gt);font-weight:800;font-size:11px;padding:1px 7px;border-radius:999px;cursor:pointer;margin-left:auto;flex:none}
.extras{grid-column:1/-1;border-top:1px dashed var(--line);padding-top:6px;display:flex;flex-direction:column;gap:6px}
.xr{display:flex;align-items:center;justify-content:space-between;gap:8px}
.xl{font-size:12px;color:var(--mut);font-weight:600}
.xo{display:flex;gap:5px}
.xo .odd{width:auto;min-width:84px;padding:5px 8px;flex-direction:row;gap:6px;align-items:center;justify-content:center}
.xo .odd small{max-width:96px}
.vazio{text-align:center;color:var(--mut);padding:28px 10px;font-size:14px}

.barra{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 40%)}
.barra .in{max-width:520px;margin:0 auto;background:var(--g);color:var(--gink);border-radius:16px;padding:11px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;box-shadow:0 8px 26px var(--glow);font-weight:800}
.barra .in span{font-size:12.5px;font-weight:700;opacity:.8;display:block}
.barra .in b{font-size:20px}

.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:flex;align-items:flex-end}
.sheet{width:100%;max-width:520px;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.pk{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.pk .x{background:none;border:0;color:var(--red);font-size:20px;cursor:pointer;padding:4px 8px}
.pk .o{font-weight:800;color:var(--gt);font-size:16px}
.tot{display:flex;justify-content:space-between;align-items:center;margin:12px 0}
.tot b{font-size:26px;color:var(--gt)}

/* bilhete */
.tk{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:11px;overflow:hidden;box-shadow:var(--shadow)}
.tk-h{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;border-bottom:2px dashed var(--line)}
.code{font-weight:800;font-size:21px;letter-spacing:1.5px}
.badge{font-size:11px;font-weight:800;padding:5px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:.4px}
.st-pendente{background:var(--ambbg);color:var(--amb)}
.st-validado{background:rgba(43,200,102,.18);color:var(--gt)}
.st-recusado{background:rgba(217,54,54,.13);color:var(--red)}
.tk-b{padding:4px 15px}
.it{padding:10px 0;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.it .lg{font-size:11.5px;color:var(--mut)}
.it .jg{font-weight:700;margin:1px 0}
.it .pl{display:flex;justify-content:space-between;color:var(--gt);font-weight:800}
.tk-f{padding:13px 15px;background:var(--card2);display:flex;justify-content:space-between;align-items:center}
.tk-f b{font-size:23px;color:var(--gt)}
.tk-m{padding:9px 15px;font-size:13px;color:var(--mut);border-bottom:1px solid var(--line)}
.tk-m strong{color:var(--txt)}
.aviso{background:var(--ambbg);border:1px solid rgba(245,166,35,.45);color:var(--amb);border-radius:12px;padding:10px 13px;font-size:13px;margin:10px 0}
.ok{background:rgba(43,200,102,.12);border:1px solid rgba(43,200,102,.45);color:var(--gt);border-radius:12px;padding:10px 13px;font-size:13px;margin:10px 0}
.big{text-align:center;padding:8px 0}
.big .code{font-size:34px;color:var(--gt);margin:4px 0}
.rodape{margin-top:24px;padding:12px;font-size:11.5px;color:var(--mut);opacity:.8;text-align:center;line-height:1.5}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.gate .card{max-width:380px;text-align:center;padding:26px 20px}
.gate h1{font-size:44px;margin:0;color:var(--gt)}
#toasts{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:0;right:0;z-index:99;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{background:var(--txt);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;box-shadow:0 8px 28px rgba(0,0,0,.3);max-width:420px;animation:ti .2s ease-out}
.toast.erro{background:var(--red);color:#fff}
.toast.ok{background:var(--g);color:var(--gink)}
@keyframes ti{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.tip{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700}
a{color:var(--gt)}
.slim{padding:10px 12px}
.novoap{display:none;margin-top:8px}

/* status e cupom */
.st-aguardando{background:var(--ambbg);color:var(--amb)}
.st-andamento{background:rgba(37,99,235,.14);color:var(--blue)}
.st-ganhou{background:rgba(43,200,102,.2);color:var(--gt)}
.st-perdeu{background:rgba(217,54,54,.14);color:var(--red)}
.st-anulado{background:rgba(120,130,125,.2);color:var(--mut)}
.cupom{background:var(--paper);border:1.5px solid var(--g);border-radius:16px;padding:16px 16px 14px;margin-bottom:12px;box-shadow:var(--shadow);font-size:13px}
.cp-t{text-align:center;font-weight:800;letter-spacing:5px;font-size:14px}
.cp-sub{text-align:center;color:var(--mut);font-size:11px;margin:2px 0 4px}
.cp-sep{border:0;border-top:1.5px dashed var(--g);margin:10px 0;opacity:.55}
.cp-row{display:flex;justify-content:space-between;gap:10px;line-height:1.55}
.cp-k{color:var(--mut)}
.cp-it{padding:2px 0}
.cp-b{font-weight:800}
.cp-liga{color:var(--mut);font-size:12px}
.cp-jogo{font-weight:700;margin:1px 0 4px}
.cp-ok{color:var(--gt);font-weight:800}.cp-no{color:var(--red);font-weight:800}.cp-and{color:var(--blue);font-weight:800}.cp-an{color:var(--mut);font-weight:800}
.cp-code{text-align:center;font-size:24px;font-weight:800;letter-spacing:2px;margin:2px 0}
.cp-cap{text-align:center;color:var(--mut);font-size:11px;letter-spacing:3px}
.cp-stamp{margin-top:12px;border-radius:10px;padding:11px;text-align:center;font-weight:800;letter-spacing:2px;text-transform:uppercase;font-size:15px;color:#fff}
.cp-stamp.st-ganhou{background:var(--g);color:var(--gink)}
.cp-stamp.st-perdeu{background:#D93636}
.cp-stamp.st-andamento{background:#2563EB}
.cp-stamp.st-aguardando{background:#F5A623;color:#3a2600}
.cp-stamp.st-anulado{background:#7B8A82}
.cp-stamp.st-recusado{background:#D93636}
.cp-foot{margin-top:10px;font-size:10.5px;color:var(--mut);text-align:center;line-height:1.45}
.row input[type=number]{width:74px;text-align:center;padding:10px 6px}
</style>
</head>

<script>
/* =====================================================================
   CONFIGURAÇÃO — URL e chave "anon public" do seu projeto no Supabase.
   Vazio = MODO DEMONSTRAÇÃO (dados fictícios, só neste navegador).
   ===================================================================== */
const CONFIG = {
  SUPABASE_URL: "https://lqutpolpyrbvayqsivfz.supabase.co",
  SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxxdXRwb2xweXJidmF5cXNpdmZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzNzcxOTcsImV4cCI6MjEwNjk1MzE5N30.hMty4zPTXiJe6B0Xk_jenjpcY2Lfwz_7IkFEVbntxss",
};
const MODO_DEMO = !CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_ANON_KEY;

/* ---------------------------- utilidades ---------------------------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = (s) => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
const fmtOdd = (n) => Number(n).toFixed(2);
// Limites do bilhete (o servidor aplica os mesmos valores)
const MAX_JOGOS = 10, ODD_MAX = 100, FICHAS_PADRAO = 100;
const fmtFichas = (n) => Math.round(Number(n) * 100) / 100 === Math.round(Number(n)) ? String(Math.round(Number(n))) : Number(n).toFixed(2).replace('.', ',');
const retornoDe = (b, odd) => Number(b.valor_simulado || FICHAS_PADRAO) * Number(odd);
const fmtHora = (iso) => new Date(iso).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
const fmtDataCurta = (iso) => new Date(iso).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });
const fmtDataHora = (iso) => `${fmtDataCurta(iso)} ${fmtHora(iso)}`;
function fmtDia(iso) {
  const d = new Date(iso), h = new Date(), am = new Date(h.getTime() + 864e5);
  const igual = (a, b) => a.toDateString() === b.toDateString();
  if (igual(d, h)) return "Hoje";
  if (igual(d, am)) return "Amanhã";
  return d.toLocaleDateString("pt-BR", { weekday: "long", day: "2-digit", month: "2-digit" });
}
const EMOJI = { Futebol: "⚽", Basquete: "🏀", MMA: "🥊", "Tênis": "🎾" };
const emoji = (e) => EMOJI[e] || "🎯";
const unidade = (esp) => (esp === "Futebol" ? "gols" : esp === "Basquete" ? "pontos" : "");
const sinal = (n) => (Number(n) > 0 ? "+" + Number(n) : String(Number(n)));
const abrev = (s) => (s.length > 11 ? s.slice(0, 10) + "…" : s);
const baseUrl = () => location.href.split("?")[0].split("#")[0];
const linkCupom = (cod) => `${baseUrl()}?b=${cod}`;
const fmtDataCompleta = (iso) => new Date(iso).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }).replace(",", "");
const SIT = { aguardando: "Aguardando validação", andamento: "Em andamento", ganhou: "Ganhou", perdeu: "Perdeu", anulado: "Anulado", recusado: "Recusado" };
const RES = { pendente: ["⏳ Em andamento", "andamento", "cp-and"], ganhou: ["✔ Acertou", "ganhou", "cp-ok"], perdeu: ["✖ Errou", "perdeu", "cp-no"], anulado: ["↩ Anulado", "anulado", "cp-an"] };
function situacaoBilhete(b) {
  if (b.status === "pendente") return "aguardando";
  if (b.status === "recusado") return "recusado";
  const rs = b.itens.map((i) => i.resultado || "pendente");
  if (rs.includes("perdeu")) return "perdeu";
  if (rs.includes("pendente")) return "andamento";
  if (rs.every((r) => r === "anulado")) return "anulado";
  return "ganhou";
}
function nomeMercado(i) {
  const m = i.mercado || "h2h";
  if (m === "totals") return `Total de ${unidade(i.esporte_nome) || "pontos"}`;
  if (m === "spreads") return "Handicap";
  return i.esporte_nome === "Futebol" ? "Resultado final" : "Vencedor da partida";
}
const jogador = (b) => (b.apostador && b.apostador.apelido) || b.apelido_informado || "—";
function textoCupom(b) {
  return [`🟢 *ZSGREEN* — Bilhete *${b.codigo}*`, `Jogador: ${jogador(b)}`,
    `${b.itens.length} ${b.itens.length === 1 ? "jogo" : "jogos"} · Cotação total: ${fmtOdd(b.odd_total)}`,
    `Valor simulado: ${fmtFichas(b.valor_simulado || FICHAS_PADRAO)} fichas · Retorno simulado: ${fmtFichas(retornoDe(b, b.odd_total))} fichas`,
    `Status: ${SIT[situacaoBilhete(b)]}`, "", `Acompanhe aqui: ${linkCupom(b.codigo)}`].join("\n");
}
function rotuloMercado(i) {
  const m = i.mercado || "h2h";
  if (m === "totals") return `${i.selecao === "mais" ? "Mais" : "Menos"} de ${Number(i.linha)} ${unidade(i.esporte_nome)}`.trim();
  if (m === "spreads") {
    const l = i.selecao === "casa" ? Number(i.linha) : -Number(i.linha);
    return `${i.selecao === "casa" ? i.casa : i.fora} (${sinal(l)})`;
  }

  function load() {
    let db; try { db = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
    if (!db) db = seed();
    if (!db.placares) db.placares = {};
    if (Date.now() - db.eventosEm > 12 * HORA) { db.gen = (db.gen || 1) + 1; db.eventos = gerarEventos(db.eventos, db.gen); db.eventosEm = Date.now(); }

  }
  const save = (db) => localStorage.setItem(KEY, JSON.stringify(db));
  const perfilLogado = (db) => { const id = localStorage.getItem(SKEY); return db.perfis.find((p) => p.id === id && p.ativo) || null; };
  const exigeStaff = (db) => { const p = perfilLogado(db); if (!p) throw new Error("NAO_AUTORIZADO"); return p; };
  const exigeAdmin = (db) => { const p = exigeStaff(db); if (p.role !== "admin") throw new Error("NAO_AUTORIZADO"); return p; };
  const pub = (p) => ({ id: p.id, nome: p.nome, role: p.role, ativo: p.ativo, telefone: p.telefone, email: p.email });
  function bilheteJson(db, b) {
    const a = b.apostador_id ? db.apostadores.find((x) => x.id === b.apostador_id) : null;
    const sp = a ? db.perfis.find((x) => x.id === a.supervisor_id) : null;

  }

  const primeiroJogo = (b) => Math.min(...b.itens.map((i) => new Date(i.inicio).getTime()));
  const delay = (v) => new Promise((r) => setTimeout(() => r(v), 30));

  function processa(codigo, novo, apostadorId) {
    const db = load(), p = exigeStaff(db), b = achaBilhete(db, codigo);
    if (!b) throw new Error("BILHETE_NAO_ENCONTRADO");
    if (b.status !== "pendente") throw new Error("BILHETE_JA_PROCESSADO");
    if (novo === "validado") {
      if (primeiroJogo(b) <= Date.now()) throw new Error("PRAZO_ENCERRADO");
      if (!db.apostadores.some((a) => a.id === apostadorId && a.ativo && a.supervisor_id === p.id)) throw new Error("APOSTADOR_INVALIDO");
      b.apostador_id = apostadorId;
    }
    b.status = novo; b.validado_por = p.id; b.validado_em = new Date().toISOString(); save(db);
    return Promise.resolve(bilheteJson(db, b));
  }

  function resultadoItem(i, p) {
    if (!p) return "pendente";
    if (p.anulado) return "anulado";
    const gc = p.casa, gf = p.fora;
    if (i.mercado === "h2h") return (i.selecao === "casa" && gc > gf) || (i.selecao === "fora" && gf > gc) || (i.selecao === "empate" && gc === gf) ? "ganhou" : "perdeu";
    const l = Number(i.linha);
    if (i.mercado === "totals") { const t = gc + gf; if (t === l) return "anulado"; return (i.selecao === "mais" && t > l) || (i.selecao === "menos" && t < l) ? "ganhou" : "perdeu"; }
    if (i.mercado === "spreads") { if (gc + l === gf) return "anulado"; return (i.selecao === "casa" && gc + l > gf) || (i.selecao === "fora" && gf > gc + l) ? "ganhou" : "perdeu"; }
    return i.resultado || "pendente";
  }
  function aplicarPlacar(db, evId) { for (const b of db.bilhetes) for (const i of b.itens) if (i.evento_id === evId) i.resultado = resultadoItem(i, db.placares[evId]); }

  return {
    nome: "demo",
    async eventos() { const db = load(); save(db); return delay(db.eventos.filter((e) => new Date(e.inicio) > new Date()).sort((a, b) => new Date(a.inicio) - new Date(b.inicio))); },
    async banners() { const db = load(), p = perfilLogado(db); return delay(db.banners.filter((b) => b.ativo || (p && p.role === "admin"))); },
    async criarBilhete(itens, apelido, valor) {

      if (!Array.isArray(itens) || !itens.length) throw new Error("BILHETE_VAZIO");
      if (itens.length > 10) throw new Error("MUITOS_JOGOS");
      const vistos = new Set(); let total = 1; const linhas = [];
      for (const it of itens) {
        const ev = db.eventos.find((e) => e.id === it.evento_id);
        if (!ev) throw new Error("EVENTO_INEXISTENTE");
        if (new Date(ev.inicio).getTime() < Date.now() + 5 * 60e3) throw new Error("EVENTO_JA_COMECOU");
        if (vistos.has(ev.id)) throw new Error("EVENTO_REPETIDO"); vistos.add(ev.id);
        const m = it.mercado || "h2h"; let odd = null, linha = null;
        if (m === "h2h") {

        } else if (m === "totals" || m === "spreads") {
          if (!(m === "totals" ? ["mais", "menos"] : ["casa", "fora"]).includes(it.selecao)) throw new Error("SELECAO_INVALIDA");
          linha = Number(it.linha);
          const l = ((ev.extras || {})[m] || []).find((x) => Number(x.linha) === linha); odd = l ? l[it.selecao] : null;
        } else throw new Error("MERCADO_INVALIDO");
        if (!odd) throw new Error("ODD_INDISPONIVEL");
        linhas.push({ evento_id: ev.id, esporte_nome: ev.esporte_nome, liga: ev.liga, casa: ev.casa, fora: ev.fora, inicio: ev.inicio, mercado: m, selecao: it.selecao, linha, odd });
        total *= odd;
      }
      if (Math.round(total * 100) / 100 > 100) throw new Error("ODD_MAXIMA");
      const AL = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let codigo;
      do { codigo = "ZS-" + Array.from({ length: 6 }, () => AL[Math.floor(Math.random() * 32)]).join(""); } while (achaBilhete(db, codigo));
      const b = { id: uid(), codigo, apostador_id: null, apelido_informado: String(apelido || "").trim().slice(0, 30) || null, status: "pendente", odd_total: Math.round(total * 100) / 100, valor_simulado: valor, criado_em: new Date().toISOString(), itens: linhas };
      db.bilhetes.push(b); save(db);
      return delay({ codigo, odd_total: b.odd_total });
    },
    async bilhetesPorCodigos(codigos) {
      const db = load(), cs = (codigos || []).slice(0, 30).map((c) => String(c).trim().toUpperCase());
      return delay(db.bilhetes.filter((b) => cs.includes(b.codigo)).sort((x, y) => new Date(y.criado_em) - new Date(x.criado_em)).map((b) => bilheteJson(db, b)));
    },
    async login(email, senha) {
      const db = load();
      const p = db.perfis.find((x) => x.email === String(email).trim().toLowerCase() && x.senha === senha);
      if (!p) throw new Error("CREDENCIAIS");
      if (!p.ativo) throw new Error("CONTA_SEM_ACESSO");
      localStorage.setItem(SKEY, p.id); return delay(pub(p));
    },
    async sessao() { const db = load(), p = perfilLogado(db); return p ? pub(p) : null; },
    async logout() { localStorage.removeItem(SKEY); },
    async listarApostadores() {
      const db = load(), p = exigeStaff(db);
      return delay(db.apostadores.filter((a) => p.role === "admin" || a.supervisor_id === p.id).sort((x, y) => new Date(y.criado_em) - new Date(x.criado_em)));
    },
    async criarApostador(nome, apelido, telefone) {
      const db = load(), p = exigeStaff(db);
      const a = { id: uid(), supervisor_id: p.id, nome, apelido, telefone: telefone ? String(telefone).replace(/\D/g, "") : null, ativo: true, criado_em: new Date().toISOString() };
      db.apostadores.push(a); save(db); return delay(a);
    },
    async setApostadorAtivo(id, ativo) { const db = load(), p = exigeStaff(db); const a = db.apostadores.find((x) => x.id === id && x.supervisor_id === p.id); if (a) a.ativo = ativo; save(db); },
    async obterBilhete(codigo) {
      const db = load(); exigeStaff(db);
      const b = achaBilhete(db, codigo); if (!b) return null;
      return delay({ ...bilheteJson(db, b), pode_validar: b.status === "pendente" && primeiroJogo(b) > Date.now(), primeiro_jogo: new Date(primeiroJogo(b)).toISOString(), apostador_id: b.apostador_id });
    },
    async validarBilhete(codigo, apostadorId) { return processa(codigo, "validado", apostadorId); },
    async recusarBilhete(codigo) { return processa(codigo, "recusado"); },
    async listarBilhetesSupervisor() {
      const db = load(), p = exigeStaff(db);
      return delay(db.bilhetes.filter((b) => b.validado_por === p.id || (b.status === "pendente" && primeiroJogo(b) > Date.now()))
        .sort((x, y) => new Date(y.criado_em) - new Date(x.criado_em)).slice(0, 150).map((b) => bilheteJson(db, b)));
    },
    async listarSupervisores() { const db = load(); exigeAdmin(db); return delay(db.perfis.filter((p) => p.role === "supervisor").map(pub)); },
    async criarSupervisor(d) {

      const email = String(d.email || "").trim().toLowerCase();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) throw new Error("E-mail inválido");
      if (String(d.senha || "").length < 6) throw new Error("A senha precisa ter ao menos 6 caracteres");

      if (id === me.id) throw new Error("NAO_PODE_DESATIVAR_A_SI_MESMO");

    async adminListarBilhetes() { const db = load(); exigeAdmin(db); return delay([...db.bilhetes].sort((x, y) => new Date(y.criado_em) - new Date(x.criado_em)).slice(0, 300).map((b) => bilheteJson(db, b))); },
    async setDestaque(id, valor) { const db = load(); exigeAdmin(db); const e = db.eventos.find((x) => x.id === id); if (e) e.destaque = valor; save(db); },
    async salvarBanner(d) {
      const db = load(); exigeAdmin(db);
      if (String(d.titulo || "").trim().length < 2) throw new Error("TITULO_INVALIDO");
      db.banners.push({ id: uid(), titulo: d.titulo.trim().slice(0, 60), texto: String(d.texto || "").trim().slice(0, 160), cor: d.cor || "verde", ativo: true }); save(db);
    },
    async setBannerAtivo(id, ativo) { const db = load(); exigeAdmin(db); const b = db.banners.find((x) => x.id === id); if (b) b.ativo = ativo; save(db); },
    async excluirBanner(id) { const db = load(); exigeAdmin(db); db.banners = db.banners.filter((x) => x.id !== id); save(db); },
    async sincronizarJogos() { const db = load(); exigeAdmin(db); db.gen = (db.gen || 1) + 1; db.eventos = gerarEventos(db.eventos, db.gen); db.eventosEm = Date.now(); save(db); return delay({ mensagem: "Demonstração: jogos fictícios regenerados.", detalhe: [] }); },
    async jogosParaResultado() {
      const db = load(); exigeStaff(db);
      const mapa = {};
      for (const b of db.bilhetes) if (b.status === "validado") for (const i of b.itens) {
        const t = new Date(i.inicio).getTime();
        if (t > Date.now() || t < Date.now() - 5 * 24 * HORA) continue;
        const m = mapa[i.evento_id] || (mapa[i.evento_id] = { evento_id: i.evento_id, esporte_nome: i.esporte_nome, liga: i.liga, casa: i.casa, fora: i.fora, inicio: i.inicio, qtd: 0, placar: null });
        m.qtd++;
      }
      for (const m of Object.values(mapa)) { const pl = db.placares[m.evento_id]; if (pl) m.placar = { casa: pl.casa, fora: pl.fora, anulado: !!pl.anulado, por: pl.por }; }
      return delay(Object.values(mapa).sort((a, b) => new Date(b.inicio) - new Date(a.inicio)));
    },
    async registrarPlacar(evId, casa, fora, anulado) {
      const db = load(), p = exigeStaff(db);
      const itens = db.bilhetes.flatMap((b) => b.itens).filter((i) => i.evento_id === evId);
      if (!itens.length) throw new Error("JOGO_NAO_ENCONTRADO");
      if (Math.min(...itens.map((i) => new Date(i.inicio).getTime())) > Date.now()) throw new Error("JOGO_NAO_COMECOU");
      if (!anulado && (casa == null || fora == null || casa < 0 || fora < 0)) throw new Error("PLACAR_INVALIDO");
      db.placares[evId] = { casa: anulado ? null : casa, fora: anulado ? null : fora, anulado: !!anulado, por: p.nome };
      aplicarPlacar(db, evId); save(db);
    },
    async apagarPlacar(evId) { const db = load(); exigeStaff(db); delete db.placares[evId]; aplicarPlacar(db, evId); save(db); },
    resetar() { localStorage.removeItem(KEY); localStorage.removeItem(SKEY); },
  };
}

   ===================================================================== */
async function supabaseBackend() {
  await new Promise((ok, falha) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
    s.onload = ok; s.onerror = () => falha(new Error("Não consegui carregar o Supabase. Verifique a internet."));
    document.head.appendChild(s);
  });
  const sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  const rpc = async (fn, args) => { const { data, error } = await sb.rpc(fn, args); if (error) throw new Error(error.message); return data; };
  const tab = async (q) => { const { data, error } = await q; if (error) throw new Error(error.message); return data; };
  async function perfilAtual() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) return null;
    const { data } = await sb.from("profiles").select("id,nome,role,telefone,ativo").eq("id", session.user.id).maybeSingle();
    return data && data.ativo ? data : null;
  }
  async function chamaFuncao(nome, corpo) {
    const { data, error } = await sb.functions.invoke(nome, { body: corpo });
    if (error) {
      let detalhe = error.message;
      try { const j = await error.context.json(); if (j && (j.erro || j.message)) detalhe = j.erro || j.message; } catch (e) {}
      throw new Error(detalhe);
    }
    return data;
  }
  return {
    nome: "supabase",
    eventos: () => tab(sb.from("eventos").select("*").gt("inicio", new Date().toISOString()).order("inicio").limit(800)),
    banners: () => tab(sb.from("banners").select("*").order("criado_em", { ascending: false })),
    criarBilhete: (itens, apelido, valor) => rpc("criar_bilhete", { p_itens: itens, p_apelido: apelido, p_valor: valor }),
    bilhetesPorCodigos: (codigos) => rpc("bilhetes_por_codigos", { p_codigos: codigos }),
    async login(email, senha) {
      const { error } = await sb.auth.signInWithPassword({ email: String(email).trim(), password: senha });
      if (error) throw new Error("CREDENCIAIS");
      const p = await perfilAtual();
      if (!p) { await sb.auth.signOut(); throw new Error("CONTA_SEM_ACESSO"); }
      return p;
    },
    sessao: perfilAtual,
    logout: () => sb.auth.signOut(),
    listarApostadores: () => tab(sb.from("apostadores").select("id,nome,apelido,telefone,ativo,criado_em,supervisor_id").order("criado_em", { ascending: false })),
    async criarApostador(nome, apelido, telefone) {
      const { data: { session } } = await sb.auth.getSession();
      const tel = telefone ? String(telefone).replace(/\D/g, "") : null;
      return tab(sb.from("apostadores").insert({ supervisor_id: session.user.id, nome, apelido, telefone: tel }).select().single());
    },
    async setApostadorAtivo(id, ativo) { await tab(sb.from("apostadores").update({ ativo }).eq("id", id)); },
    obterBilhete: (codigo) => rpc("obter_bilhete", { p_codigo: codigo }),
    validarBilhete: (codigo, apostadorId) => rpc("validar_bilhete", { p_codigo: codigo, p_apostador: apostadorId }),
    recusarBilhete: (codigo) => rpc("recusar_bilhete", { p_codigo: codigo }),
    listarBilhetesSupervisor: () => rpc("listar_bilhetes_supervisor"),
    listarSupervisores: () => tab(sb.from("profiles").select("id,nome,role,telefone,ativo,criado_em").eq("role", "supervisor").order("nome")),
    async criarSupervisor(d) { await chamaFuncao("criar-supervisor", d); },
    async setSupervisorAtivo(id, ativo) { await rpc("admin_set_ativo", { p_id: id, p_ativo: ativo }); },
    adminListarBilhetes: () => rpc("admin_listar_bilhetes"),
    jogosParaResultado: () => rpc("jogos_para_resultado"),
    async registrarPlacar(evId, casa, fora, anulado) { await rpc("registrar_placar", { p_evento: evId, p_casa: casa, p_fora: fora, p_anulado: !!anulado }); },
    async apagarPlacar(evId) { await rpc("apagar_placar", { p_evento: evId }); },
    async setDestaque(id, valor) { await rpc("admin_set_destaque", { p_id: id, p_valor: valor }); },
    async salvarBanner(d) { await rpc("admin_salvar_banner", { p_titulo: d.titulo, p_texto: d.texto || "", p_cor: d.cor || "verde" }); },
    async setBannerAtivo(id, ativo) { await rpc("admin_set_banner_ativo", { p_id: id, p_ativo: ativo }); },
    async excluirBanner(id) { await rpc("admin_excluir_banner", { p_id: id }); },
    async sincronizarJogos() {
      const r = await chamaFuncao("sync-odds", { force: true });
      const lista = r.resultado || [];
      const ok = lista.filter((x) => x.eventos !== undefined).length;
      const detalhe = lista.map((x) => (x.eventos !== undefined ? `${x.esporte}: ${x.eventos} jogos` : x.erro ? `${x.esporte}: erro ${x.erro} da API` : `${x.esporte}: pulado (${x.pulado})`));
      if (!lista.length) detalhe.push("Nenhuma competição da lista está ativa na The Odds API agora.");
      return { mensagem: `Atualizado: ${ok} competição(ões). Créditos restantes da API: ${r.creditos_restantes ?? "?"}.`, detalhe };
    },
  };
}

const pageHtml = (inner) => `<div class="wrap">${demoBanner()}${inner}${RODAPE}</div>`;

const topo = (extra = "") => `<div class="top">${logoHtml}<div class="row">${extra}${temaBtn()}</div></div>`;

/* mercados / palpites */
const pickIgual = (a, b) => !!a && a.mercado === b.mercado && a.selecao === b.selecao && Number(a.linha ?? 0) === Number(b.linha ?? 0);
function oddDe(e, p) {
  if (!e || !p) return null;
  if (p.mercado === "h2h") return e.odds[p.selecao] ?? null;
  const l = ((e.extras || {})[p.mercado] || []).find((x) => Number(x.linha) === Number(p.linha));
  return l ? l[p.selecao] ?? null : null;
}
const rotuloPick = (e, p) => rotuloMercado({ ...p, casa: e.casa, fora: e.fora, esporte_nome: e.esporte_nome });

/* ------------------------------ boot ------------------------------ */
async function boot() {
  try { S.be = MODO_DEMO ? demoBackend() : await supabaseBackend(); }
  catch (e) { app.innerHTML = pageHtml(`<div class="card"><h2>Ops</h2><p class="mut">${esc(msgErro(e))}</p></div>`); return; }
  const qs = new URLSearchParams(location.search);
  S.codigoPendente = qs.get("v"); S.cupomCodigo = qs.get("b");
  S.apelido = localStorage.getItem("zs_apelido") || "";
  try { S.valor = Math.max(1, Math.min(10000, Math.round(Number(localStorage.getItem("zs_valor"))) || FICHAS_PADRAO)); } catch (e) { S.valor = FICHAS_PADRAO; }
  try { S.codigos = JSON.parse(localStorage.getItem("zs_codigos")) || []; } catch (e) { S.codigos = []; }
  if (localStorage.getItem("zs_18") !== "1") { S.view = "gate"; return render(); }
  await iniciar();
}
async function carregarJogos() {
  const [ev, bn] = await Promise.all([S.be.eventos(), S.be.banners().catch(() => [])]);
  S.eventos = ev; S.banners = bn;
  if (!S.picksOk) {
    S.picksOk = true;
    let pk = {}; try { pk = JSON.parse(localStorage.getItem("zs_picks")) || {}; } catch (e) {}
    for (const [id, p] of Object.entries(pk)) {
      const e = S.eventos.find((x) => x.id === id);
      const pp = typeof p === "string" ? { mercado: "h2h", selecao: p, linha: null } : p;
      if (e && oddDe(e, pp)) S.picks[id] = pp;
    }
  }
}
function iniciarAutoRefresh() {
  if (S.timer) clearInterval(S.timer);
  S.timer = setInterval(async () => {
    if (S.view !== "acompanhar" || document.hidden) return;
    try { const r = await S.be.bilhetesPorCodigos([S.cupomCodigo]); if (r[0]) { S.cupom = r[0]; render(); } } catch (e) {}
  }, 60000);
}
async function iniciar() {
  try {
    if (S.cupomCodigo) {
      S.cupom = (await S.be.bilhetesPorCodigos([S.cupomCodigo]))[0] || null;
      S.view = "acompanhar"; iniciarAutoRefresh(); return render();
    }
    S.perfil = await S.be.sessao();
    if (S.codigoPendente) {
      if (S.perfil) { S.view = "staff"; S.abaStaff = "validar"; S.codigoBusca = S.codigoPendente; await buscarBilhete(); return render(); }
      S.view = "login"; return render();
    }
    await carregarJogos(); S.view = "jogos"; S.aba = "jogos"; render();
  } catch (e) { toast(msgErro(e), "erro"); S.view = "jogos"; render(); }
}

/* ----------------------------- render ----------------------------- */
function render() {
  const v = S.view;
  if (v === "gate") app.innerHTML = viewGate();
  else if (v === "login") app.innerHTML = viewLogin();
  else if (v === "jogos") app.innerHTML = viewJogos();
  else if (v === "bilheteGerado") app.innerHTML = viewBilheteGerado();
  else if (v === "staff") app.innerHTML = viewStaff();
  else if (v === "acompanhar") app.innerHTML = viewAcompanhar();
  else app.innerHTML = pageHtml(`<div class="vazio">Carregando…</div>`);
  const chave = v + "|" + (v === "jogos" ? S.aba : v === "staff" ? S.abaStaff : "");
  if (chave !== S.chave) { S.chave = chave; window.scrollTo(0, 0); }
  if (v === "jogos") { if (S.aba === "jogos") { drawChips(); drawLista(); } drawBarra(); }
}

function oddBtn(e, mercado, selecao, linha, rot, odd, off) {
  const on = pickIgual(S.picks[e.id], { mercado, selecao, linha });
  const l = linha !== null && linha !== undefined ? ` data-l="${linha}"` : "";
  return `<button class="odd ${on ? "on" : ""}" ${off ? "disabled" : ""} data-act="pick" data-ev="${esc(e.id)}" data-m="${mercado}" data-sel="${selecao}"${l}><small>${esc(rot)}</small><b>${fmtOdd(odd)}</b></button>`;

function extrasHtml(e, off) {
  const un = unidade(e.esporte_nome);
  let h = '<div class="extras">';
  for (const t of (e.extras || {}).totals || [])
    h += `<div class="xr"><span class="xl">Total ${un} ${t.linha}</span><div class="xo">${oddBtn(e, "totals", "mais", t.linha, "Mais", t.mais, off)}${oddBtn(e, "totals", "menos", t.linha, "Menos", t.menos, off)}</div></div>`;
  for (const s of (e.extras || {}).spreads || [])
    h += `<div class="xr"><span class="xl">Handicap</span><div class="xo">${oddBtn(e, "spreads", "casa", s.linha, `${abrev(e.casa)} ${sinal(s.linha)}`, s.casa, off)}${oddBtn(e, "spreads", "fora", s.linha, `${abrev(e.fora)} ${sinal(-s.linha)}`, s.fora, off)}</div></div>`;
  return h + "</div>";
}
function linhaEvento(e, vert) {
  const off = new Date(e.inicio).getTime() < Date.now() + 5 * 60e3;
  const h2 = e.odds.empate ? [["casa", "1"], ["empate", "X"], ["fora", "2"]] : [["casa", "1"], ["fora", "2"]];
  const ex = e.extras || {};
  const nExtras = (ex.totals || []).length + (ex.spreads || []).length;
  const temExtras = nExtras > 0;
  const aberto = !!S.abertos[e.id];
  return `<div class="ev ${e.destaque ? "dest" : ""} ${vert ? "vert" : ""}">
    <div class="ev-info"><div class="ev-meta"><span class="lg">${emoji(e.esporte_nome)} ${esc(e.liga || "")}</span><b>${off ? "Encerrado" : (vert ? fmtDia(e.inicio) + " " : "") + fmtHora(e.inicio)}</b>${temExtras ? `<button class="mais" data-act="toggle-extras" data-ev="${esc(e.id)}" title="Mais mercados (mais/menos gols, handicap)">${aberto ? "−" + nExtras + " ▴" : "+" + nExtras + " ▾"}</button>` : ""}</div>
      <div class="ev-t">${esc(e.casa)}</div><div class="ev-t">${esc(e.fora)}</div></div>
    <div class="odds">${h2.map(([s, r]) => oddBtn(e, "h2h", s, null, r, e.odds[s], off)).join("")}</div>
    ${aberto ? extrasHtml(e, off) : ""}</div>`;
}

    (!termo || norm(`${e.casa} ${e.fora} ${e.liga}`).includes(termo));

  </div></div>`;
}

  S.buscou = true; S.selAp = "";

    S.bilheteAberto = await S.be.obterBilhete(S.codigoBusca.trim().toUpperCase());
    if (S.bilheteAberto) S.apostadores = await S.be.listarApostadores();
  } catch (e) { S.bilheteAberto = null; toast(msgErro(e), "erro"); }
}
async function carregaAba() {
  try {
    if (S.abaStaff === "apostadores") S.apostadores = await S.be.listarApostadores();
    if (S.abaStaff === "bilhetes") S.bilhetesStaff = await S.be.listarBilhetesSupervisor();
    if (S.abaStaff === "resultados") S.jogosRes = await S.be.jogosParaResultado();
    if (S.abaStaff === "supervisores") S.supervisores = await S.be.listarSupervisores();
    if (S.abaStaff === "todos") S.bilhetesAdmin = await S.be.adminListarBilhetes();
    if (S.abaStaff === "avisos") S.banners = await S.be.banners();
    if (S.abaStaff === "jogos") {
      S.eventos = await S.be.eventos();
      const t = S.eventos.map((e) => e.atualizado_em).filter(Boolean).sort().pop();
      S.ultimaSync = t ? fmtDataHora(t) : "";
    }
  } catch (e) { toast(msgErro(e), "erro"); }
}
async function acao(btn) {
  const a = btn.dataset.act, d = btn.dataset;
  try {
    switch (a) {
      case "aceitar-18": localStorage.setItem("zs_18", "1"); return iniciar();
      case "recusar-18": app.innerHTML = pageHtml(`<div class="vazio" style="padding-top:80px">Esse conteúdo não é para menores de 18 anos.</div>`); return;
      case "resetar-demo": S.be.resetar(); S.picks = {}; S.codigos = []; localStorage.removeItem("zs_codigos"); localStorage.removeItem("zs_picks"); toast("Demonstração zerada", "ok"); return iniciar();
      case "tema": {
        const t = document.documentElement.dataset.tema === "escuro" ? "claro" : "escuro";
        document.documentElement.dataset.tema = t; localStorage.setItem("zs_tema", t); return render();
      }
      case "entrar-staff": S.view = "login"; return render();
      case "ir-jogos": S.cupomCodigo = null; await carregarJogos(); S.view = "jogos"; S.aba = "jogos"; return render();
      case "ir-painel": S.view = "staff"; await carregaAba(); return render();
      case "sair": await S.be.logout(); S.perfil = null; S.bilheteAberto = null; S.buscou = false; await carregarJogos(); S.view = "jogos"; S.aba = "jogos"; return render();
      // jogos / bilhete
      case "tab-jogos":
        S.aba = d.tab; S.sheet = false;
        if (d.tab === "meus") S.bilhetes = S.codigos.length ? await S.be.bilhetesPorCodigos(S.codigos) : [];
        return render();
      case "chip": S.esporte = d.esp; drawChips(); return drawLista();
      case "toggle-extras": S.abertos[d.ev] = !S.abertos[d.ev]; return drawLista();
      case "pick": {
        const p = { mercado: d.m, selecao: d.sel, linha: d.l !== undefined ? Number(d.l) : null };
        const cur = S.picks[d.ev];
        if (cur && pickIgual(cur, p)) delete S.picks[d.ev];
        else { if (!cur && Object.keys(S.picks).length >= MAX_JOGOS) return toast(`Máximo de ${MAX_JOGOS} jogos por bilhete`, "erro"); S.picks[d.ev] = p; }
        salvarPicks(); drawLista(); return drawBarra();
      }
      case "abrir-sheet": S.sheet = true; return drawSheet();
      case "fechar-sheet": S.sheet = false; return drawSheet();
      case "rm-pick": delete S.picks[d.ev]; salvarPicks(); if (!Object.keys(S.picks).length) S.sheet = false; drawSheet(); drawLista(); return drawBarra();
      case "limpar-picks": S.picks = {}; salvarPicks(); S.sheet = false; drawSheet(); drawLista(); return drawBarra();
      case "gerar-bilhete": {
        const ap = ($("#ap-inf").value || "").trim();
        if (ap.length < 2) return toast("Informe seu apelido (mínimo 2 letras)", "erro");
        S.apelido = ap; localStorage.setItem("zs_apelido", ap);
        const vl = Math.round(Number(($("#vl-inf").value || "").replace(",", ".")));
        if (!(vl >= 1 && vl <= 10000)) return toast(msgErro(new Error("VALOR_INVALIDO")), "erro");
        if (Object.keys(S.picks).length > MAX_JOGOS) return toast(msgErro(new Error("MUITOS_JOGOS")), "erro");
        if (oddTotalPicks() > ODD_MAX) return toast(msgErro(new Error("ODD_MAXIMA")), "erro");
        S.valor = vl; try { localStorage.setItem("zs_valor", String(vl)); } catch (e) {}
        btn.disabled = true;
        const itens = Object.entries(S.picks).map(([evento_id, p]) => ({ evento_id, mercado: p.mercado, selecao: p.selecao, linha: p.linha }));
        try {
          const r = await S.be.criarBilhete(itens, ap, vl);
          S.codigos = [r.codigo, ...S.codigos.filter((c) => c !== r.codigo)].slice(0, 30);
          localStorage.setItem("zs_codigos", JSON.stringify(S.codigos));
          S.ultimo = (await S.be.bilhetesPorCodigos([r.codigo]))[0];
          S.picks = {}; salvarPicks(); S.sheet = false; S.view = "bilheteGerado"; return render();
        } catch (e) { btn.disabled = false; toast(msgErro(e), "erro"); if (/EVENTO|ODD/.test(e.message)) { await carregarJogos(); drawLista(); drawSheet(); } return; }
      }
      case "voltar-jogos": await carregarJogos(); S.view = "jogos"; S.aba = "jogos"; return render();
      case "wa-bilhete": { const b = S.bilhetes.find((x) => x.codigo === d.cod) || S.ultimo; window.open(waLink("", textoBilhete(b)), "_blank"); return; }
      case "copiar-bilhete": { const b = S.bilhetes.find((x) => x.codigo === d.cod) || S.ultimo; await copiar(textoBilhete(b)); return toast("Texto copiado", "ok"); }
      // staff
      case "tab-staff": S.abaStaff = d.tab; await carregaAba(); return render();
      case "atualizar-cupom": { const r = await S.be.bilhetesPorCodigos([S.cupomCodigo]); S.cupom = r[0] || null; toast("Status atualizado", "ok"); return render(); }
      case "wa-cupom": { const b = [S.cupom, S.ultimo, S.bilheteAberto, ...S.bilhetes].find((x) => x && x.codigo === d.cod); window.open(waLink("", textoCupom(b)), "_blank"); return; }
      case "wa-cupom-jogador": { const b = S.bilheteAberto; window.open(waLink(d.tel, textoCupom(b)), "_blank"); return; }
      case "copiar-link-cupom": await copiar(linkCupom(d.cod)); return toast("Link do cupom copiado", "ok");
      case "atualizar-meus": S.bilhetes = S.codigos.length ? await S.be.bilhetesPorCodigos(S.codigos) : []; toast("Status atualizado", "ok"); return render();
      case "salvar-placar": {
        const card = btn.closest("[data-card]");
        const c = parseInt(card.querySelector(".pc-casa").value, 10), f = parseInt(card.querySelector(".pc-fora").value, 10);
        if (isNaN(c) || isNaN(f) || c < 0 || f < 0) return toast("Informe o placar (números a partir de 0)", "erro");
        await S.be.registrarPlacar(d.ev, c, f, false); toast("Placar salvo: bilhetes atualizados", "ok"); await carregaAba(); return render();
      }
      case "vencedor": await S.be.registrarPlacar(d.ev, d.w === "casa" ? 1 : 0, d.w === "fora" ? 1 : 0, false); toast("Resultado salvo: bilhetes atualizados", "ok"); await carregaAba(); return render();
      case "anular-jogo": if (!confirm("Anular este jogo? Os palpites nele ficam como anulados.")) return; await S.be.registrarPlacar(d.ev, null, null, true); toast("Jogo anulado", "ok"); await carregaAba(); return render();
      case "desfazer-placar": if (!confirm("Desfazer o placar? Os bilhetes voltam para “em andamento”.")) return; await S.be.apagarPlacar(d.ev); toast("Placar desfeito", "ok"); await carregaAba(); return render();
      case "abrir-bilhete": S.codigoBusca = d.cod; S.abaStaff = "validar"; await buscarBilhete(); return render();
      case "validar": {
        const sel = ($("#sel-ap") || {}).value || "";
        if (!sel) return toast("Escolha para qual apostador você está validando", "erro");
        let apId = sel, quem;
        if (sel === "__novo__") {
          const nome = ($("#na-nome").value || "").trim(), ap = ($("#na-apelido").value || "").trim();
          if (nome.length < 2 || ap.length < 2) return toast("Preencha nome e apelido do novo apostador", "erro");
          quem = ap;
          if (!confirm(`Validar o bilhete ${d.cod} para ${quem}? Ele ficará vinculado ao seu login.`)) return;
          apId = (await S.be.criarApostador(nome, ap, ($("#na-tel").value || "").trim())).id;
        } else {
          quem = (S.apostadores.find((x) => x.id === sel) || {}).apelido;
          if (!confirm(`Validar o bilhete ${d.cod} para ${quem}? Ele ficará vinculado ao seu login.`)) return;
        }
        await S.be.validarBilhete(d.cod, apId); toast("Bilhete validado", "ok");
        S.bilheteAberto = await S.be.obterBilhete(d.cod); return render();
      }
      case "recusar": {
        if (!confirm(`Recusar o bilhete ${d.cod}?`)) return;
        await S.be.recusarBilhete(d.cod); toast("Bilhete recusado", "ok");
        S.bilheteAberto = await S.be.obterBilhete(d.cod); return render();
      }
      case "wa-comprovante": {
        const b = S.bilheteAberto;
        const t = `✅ *ZSGREEN* — Bilhete *${b.codigo}* validado por ${b.validado_por_nome} em ${fmtDataHora(b.validado_em)}.\nOdd total: *${fmtOdd(b.odd_total)}*`;
        window.open(waLink("", t), "_blank"); return;
      }
      case "toggle-apostador": await S.be.setApostadorAtivo(d.id, d.ativo !== "1"); await carregaAba(); return render();
      case "filtro-bil": S.filtroBil = d.f; return render();
      case "toggle-supervisor": await S.be.setSupervisorAtivo(d.id, d.ativo !== "1"); await carregaAba(); return render();
      case "toggle-destaque": { const v = d.v !== "1"; await S.be.setDestaque(d.ev, v); const e = S.eventos.find((x) => x.id === d.ev); if (e) e.destaque = v; return render(); }
      case "toggle-banner": await S.be.setBannerAtivo(d.id, d.ativo !== "1"); await carregaAba(); return render();
      case "excluir-banner": if (!confirm("Excluir este aviso?")) return; await S.be.excluirBanner(d.id); await carregaAba(); return render();
      case "sync-jogos": {
        btn.disabled = true; btn.textContent = "Atualizando…";
        try { const r = await S.be.sincronizarJogos(); S.syncInfo = r; toast(r.mensagem, "ok"); }
        catch (e) { S.syncInfo = { erro: msgErro(e) }; }
        await carregaAba(); return render();
      }
    }
  } catch (e) { toast(msgErro(e), "erro"); render(); }
}
async function enviar(form) {
  const f = form.dataset.form;
  try {
    if (f === "login") {
      S.perfil = await S.be.login($("#lg-email").value, $("#lg-senha").value);
      S.view = "staff"; S.abaStaff = "validar";
      if (S.codigoPendente) { S.codigoBusca = S.codigoPendente; await buscarBilhete(); }
      return render();
    }
    if (f === "buscar") { S.codigoBusca = $("#cod").value; await buscarBilhete(); return render(); }
    if (f === "apostador") { await S.be.criarApostador($("#ap-nome").value.trim(), $("#ap-apelido").value.trim(), ($("#ap-tel").value || "").trim()); toast("Apostador cadastrado", "ok"); await carregaAba(); return render(); }
    if (f === "supervisor") {
      await S.be.criarSupervisor({ nome: $("#sp-nome").value.trim(), email: $("#sp-email").value.trim(), senha: $("#sp-senha").value, telefone: $("#sp-tel").value });
      toast("Supervisor criado", "ok"); await carregaAba(); return render();
    }
    if (f === "aviso") { await S.be.salvarBanner({ titulo: $("#av-t").value, texto: $("#av-x").value, cor: $("#av-c").value }); toast("Aviso publicado", "ok"); await carregaAba(); return render(); }
  } catch (e) { toast(msgErro(e), "erro"); }
}

document.addEventListener("click", (ev) => {
  const bg = ev.target.closest('[data-act="fechar-sheet-bg"]');
  if (bg && ev.target === bg) { S.sheet = false; return drawSheet(); }
  const el = ev.target.closest("[data-act]");
  if (el && el.dataset.act !== "fechar-sheet-bg") acao(el);
});
document.addEventListener("submit", (ev) => { const f = ev.target.closest("form[data-form]"); if (f) { ev.preventDefault(); enviar(f); } });
document.addEventListener("input", (ev) => {
  if (ev.target.id === "busca") { S.busca = ev.target.value; drawLista(); }
  if (ev.target.id === "vl-inf") { const v = Math.round(Number(String(ev.target.value).replace(",", "."))) || 0; S.valor = v; const r = $("#ret-sim"); if (r) r.textContent = fmtFichas(v * oddTotalPicks()) + " fichas"; }
});
document.addEventListener("change", (ev) => {
  if (ev.target.id === "sel-ap") { S.selAp = ev.target.value; const n = $("#novo-ap"); if (n) n.style.display = ev.target.value === "__novo__" ? "block" : "none"; }
});

boot();
</script>
</body>
</html>
